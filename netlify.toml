[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pdfkit"]

[[edge_functions]]
  path = "/reports/*"
  function = "reports-guard"

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Prevent clickjacking on admin and client pages specifically
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/clients/*"
  [headers.values]
    X-Frame-Options = "DENY"

# ── QR short-link redirects ───────────────────────────────────────────────────
[[redirects]]
  from = "/go/*"
  to = "/.netlify/functions/qr-redirect/:splat"
  status = 200
  force = true

# ── Block raw data/config directories from public access ─────────────────────
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/config/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.mcp.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
