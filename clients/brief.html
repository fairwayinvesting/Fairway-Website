<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Buying Brief — Fairway Investing</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="theme-color" content="#22201d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Outfit',sans-serif;font-weight:300;background:#1a1916;color:#f7f3ed;-webkit-font-smoothing:antialiased;min-height:100vh}
    a{color:inherit;text-decoration:none}

    nav{background:#22201d;border-bottom:1px solid rgba(247,243,237,0.08);padding:0 44px}
    .nav-inner{max-width:1060px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;gap:20px}
    .nav-logo{display:flex;align-items:center;gap:10px}
    .nav-user{display:flex;align-items:center;gap:16px}
    .user-name{font-size:13.5px;font-weight:400;color:rgba(247,243,237,0.5)}
    .logout-btn{font-size:13px;color:rgba(247,243,237,0.35);padding:8px 16px;border:1px solid rgba(247,243,237,0.1);border-radius:100px;cursor:pointer;background:none;transition:all .2s}
    .logout-btn:hover{color:rgba(247,243,237,0.7);border-color:rgba(247,243,237,0.2)}

    .wrap{max-width:760px;margin:0 auto;padding:56px 24px 100px}

    .eyebrow{font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#bd7a70;margin-bottom:12px}
    h1{font-family:'Fraunces',serif;font-size:40px;font-weight:400;line-height:1.15;margin-bottom:8px}
    .updated{font-size:13px;color:rgba(247,243,237,0.28);margin-bottom:48px}

    .section{margin-bottom:12px}
    .card{background:#22201d;border:1px solid rgba(247,243,237,0.09);border-radius:18px;padding:32px}
    .card-label{font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(247,243,237,0.3);margin-bottom:16px}
    .strategy-text{font-size:16px;line-height:1.8;color:rgba(247,243,237,0.75)}

    .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
    .meta-item{padding:18px 0;border-bottom:1px solid rgba(247,243,237,0.07)}
    .meta-item:nth-last-child(-n+2){border-bottom:none}
    .meta-item:nth-child(odd){padding-right:24px;border-right:1px solid rgba(247,243,237,0.07)}
    .meta-item:nth-child(even){padding-left:24px}
    .meta-label{font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:rgba(247,243,237,0.28);margin-bottom:6px}
    .meta-value{font-size:15px;font-weight:400;color:#f7f3ed}

    .checklist{display:grid;grid-template-columns:1fr 1fr;gap:0}
    .checklist-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(247,243,237,0.05)}
    .checklist-item:nth-last-child(-n+2){border-bottom:none}
    .checklist-icon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
    .checklist-icon.include{background:rgba(100,190,120,0.15);border:1px solid rgba(100,190,120,0.3)}
    .checklist-icon.exclude{background:rgba(220,80,80,0.1);border:1px solid rgba(220,80,80,0.25)}
    .checklist-text{font-size:14px;color:rgba(247,243,237,0.75);line-height:1.4}

    .market-chips{display:flex;flex-wrap:wrap;gap:8px}
    .market-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(189,122,112,0.1);border:1px solid rgba(189,122,112,0.22);border-radius:100px;font-size:13.5px;font-weight:400;color:#f7f3ed}
    .chip-state{font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:#bd7a70}

    .prop-chips{display:flex;flex-wrap:wrap;gap:8px}
    .prop-chip{padding:8px 16px;background:rgba(247,243,237,0.05);border:1px solid rgba(247,243,237,0.1);border-radius:100px;font-size:13.5px;color:rgba(247,243,237,0.65)}

    .back-link{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:rgba(247,243,237,0.35);margin-bottom:36px;transition:color .2s}
    .back-link:hover{color:rgba(247,243,237,0.6)}
    .back-link svg{opacity:0.5}

    .loading{text-align:center;padding:100px 24px}
    .spinner{width:32px;height:32px;border:2px solid rgba(247,243,237,0.08);border-top-color:#bd7a70;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading p{font-size:14px;color:rgba(247,243,237,0.28)}

    footer{border-top:1px solid rgba(247,243,237,0.06);padding:24px;text-align:center}
    footer p{font-size:12px;color:rgba(247,243,237,0.18)}

    @media(max-width:640px){
      nav{padding:0 20px}
      .wrap{padding:40px 20px 80px}
      h1{font-size:30px}
      .meta-grid{grid-template-columns:1fr}
      .meta-item:nth-child(odd){padding-right:0;border-right:none}
      .meta-item:nth-child(even){padding-left:0}
      .meta-item:nth-last-child(-n+2){border-bottom:1px solid rgba(247,243,237,0.07)}
      .meta-item:last-child{border-bottom:none}
      .checklist{grid-template-columns:1fr}
      .checklist-item:nth-last-child(-n+2){border-bottom:1px solid rgba(247,243,237,0.05)}
      .checklist-item:last-child{border-bottom:none}
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/clients/portal.html" class="nav-logo">
      <img src="/logo-icon.png" alt="" style="height:28px;width:auto">
      <img src="/logo-word.png" alt="Fairway Investing" style="height:18px;width:auto">
    </a>
    <div class="nav-user">
      <span class="user-name" id="user-name"></span>
      <button class="logout-btn" id="logout-btn">Sign out</button>
    </div>
  </div>
</nav>

<main>
  <div class="wrap" id="main-wrap">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading your brief…</p>
    </div>
  </div>
</main>

<footer>
  <p>Fairway Investing &middot; Suite 211, Level 2/5 Alexander Street, Crows Nest NSW 2065</p>
</footer>

<script>
  const MARKET_META = {
    'geelong':       { name: 'Geelong',      state: 'VIC' },
    'bendigo':       { name: 'Bendigo',       state: 'VIC' },
    'dubbo':         { name: 'Dubbo',         state: 'NSW' },
    'bacchus-marsh': { name: 'Bacchus Marsh', state: 'VIC' },
    'devonport':     { name: 'Devonport',     state: 'TAS' },
    'hobart':        { name: 'Hobart',        state: 'TAS' },
    'lara':          { name: 'Lara',          state: 'VIC' },
    'launceston':    { name: 'Launceston',    state: 'TAS' },
    'mackay':        { name: 'Mackay',        state: 'QLD' },
    'melbourne':     { name: 'Melbourne',     state: 'VIC' },
    'newcastle':     { name: 'Newcastle',     state: 'NSW' },
    'rockhampton':   { name: 'Rockhampton',   state: 'QLD' },
    'townsville':    { name: 'Townsville',    state: 'QLD' },
  };

  function fmt(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function fmtBudget(v) {
    if (!v) return null;
    const n = parseFloat(String(v).replace(/[,$]/g, ''));
    if (isNaN(n)) return null;
    return '$' + n.toLocaleString('en-AU');
  }

  function fmtBudgetRange(min, max) {
    const lo = fmtBudget(min), hi = fmtBudget(max);
    if (lo && hi) return `${lo} – ${hi}`;
    if (hi) return `Up to ${hi}`;
    if (lo) return `From ${lo}`;
    return '—';
  }

  function renderChecklist(items, type) {
    if (!items || !items.length) return '';
    const icon = type === 'include'
      ? `<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5L8 3" stroke="rgba(100,190,120,0.9)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : `<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M3 3l4 4M7 3l-4 4" stroke="rgba(210,80,80,0.8)" stroke-width="1.5" stroke-linecap="round"/></svg>`;
    return items.map(t =>
      `<div class="checklist-item">
        <span class="checklist-icon ${type}">${icon}</span>
        <span class="checklist-text">${t}</span>
      </div>`
    ).join('');
  }

  function renderBrief(brief) {
    const wrap = document.getElementById('main-wrap');

    const knownChips = (brief.targetMarkets || []).map(key => {
      const m = MARKET_META[key] || { name: key, state: '' };
      return `<span class="market-chip">${m.state ? `<span class="chip-state">${m.state}</span>` : ''}${m.name}</span>`;
    });
    const customChips = (brief.customMarkets || []).map(name =>
      `<span class="market-chip">${name}</span>`
    );
    const markets = [...knownChips, ...customChips].join('') || '<span style="color:rgba(247,243,237,0.3);font-size:14px;">To be confirmed</span>';

    const propTypes = (brief.propertyTypes || []).length
      ? brief.propertyTypes.map(t => `<span class="prop-chip">${t}</span>`).join('')
      : '';

    const allCriteria  = [...(brief.propertyCriteria || []), ...(brief.customCriteria || [])];
    const allExclusions = [...(brief.excludedCharacteristics || []), ...(brief.customExclusions || [])];

    const entityLine = brief.entityType === 'Individual'
      ? 'Individual'
      : `${brief.entityType}${brief.entityName ? ' — ' + brief.entityName : ''}`;

    const coInvLine = brief.coInvestor === 'Yes' && brief.p2Name
      ? `${brief.clientName} &amp; ${brief.p2Name}`
      : brief.clientName || '—';

    const metaItems = [
      { label: 'Purchasing entity', value: entityLine },
      { label: 'Purchaser(s)', value: coInvLine },
      { label: 'Purchase range', value: fmtBudgetRange(brief.budgetMin, brief.budgetMax) },
      { label: 'Target timeframe', value: brief.timeline || '—' },
      { label: 'Funding method', value: brief.fundingMethod || '—' },
    ].map(item => `
      <div class="meta-item">
        <p class="meta-label">${item.label}</p>
        <p class="meta-value">${item.value}</p>
      </div>`).join('');

    wrap.innerHTML = `
      <a href="/clients/portal.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back to portal
      </a>

      <p class="eyebrow">Fairway Investing</p>
      <h1>Your Buying Brief</h1>
      <p class="updated">Last updated ${fmt(brief.updatedAt)}</p>

      <div class="section">
        <div class="card">
          <p class="card-label">Strategy</p>
          <p class="strategy-text">${brief.strategyNotes ? brief.strategyNotes.replace(/\n/g, '<br>') : '—'}</p>
        </div>
      </div>

      <div class="section">
        <div class="card">
          <p class="card-label">Target markets</p>
          <div class="market-chips">${markets}</div>
        </div>
      </div>

      ${propTypes ? `
      <div class="section">
        <div class="card">
          <p class="card-label">Property types</p>
          <div class="prop-chips">${propTypes}</div>
        </div>
      </div>` : ''}

      ${allCriteria.length ? `
      <div class="section">
        <div class="card">
          <p class="card-label">Property criteria</p>
          <div class="checklist">${renderChecklist(allCriteria, 'include')}</div>
        </div>
      </div>` : ''}

      ${allExclusions.length ? `
      <div class="section">
        <div class="card">
          <p class="card-label">Excluded characteristics</p>
          <div class="checklist">${renderChecklist(allExclusions, 'exclude')}</div>
        </div>
      </div>` : ''}

      <div class="section">
        <div class="card">
          <p class="card-label">Parameters</p>
          <div class="meta-grid">${metaItems}</div>
        </div>
      </div>`;
  }

  async function init() {
    try {
      const r = await fetch('/api/me');
      if (!r.ok) { location.href = '/clients/'; return; }
      const me = await r.json();
      document.getElementById('user-name').textContent = me.name;
    } catch { location.href = '/clients/'; return; }

    try {
      const acqParam = new URLSearchParams(location.search).get('acq');
      const briefUrl = acqParam ? `/api/brief?acq=${encodeURIComponent(acqParam)}` : '/api/brief';
      const r = await fetch(briefUrl);
      if (!r.ok) throw new Error('Failed');
      const data = await r.json();
      if (!data.published) {
        document.getElementById('main-wrap').innerHTML = `
          <a href="/clients/portal.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Back to portal
          </a>
          <p class="eyebrow">Fairway Investing</p>
          <h1>Your Buying Brief</h1>
          <div class="card" style="margin-top:32px;text-align:center;padding:56px 32px">
            <p style="font-size:14px;color:rgba(247,243,237,0.4);line-height:1.75;margin-bottom:14px;">Your buying brief is being prepared.</p>
            <p style="font-size:13.5px;color:rgba(247,243,237,0.25);line-height:1.7;">Luke will review your questionnaire and publish your brief to the portal shortly.<br>Any questions in the meantime — <a href="mailto:luke@fairwayinvesting.com.au" style="color:#bd7a70;text-decoration:none;">luke@fairwayinvesting.com.au</a> &nbsp;&middot;&nbsp; <a href="tel:0416184333" style="color:#bd7a70;text-decoration:none;">0416 184 333</a></p>
          </div>`;
        return;
      }
      renderBrief(data.brief);
    } catch {
      document.getElementById('main-wrap').innerHTML = `
        <p style="color:rgba(247,243,237,0.3);text-align:center;padding:80px 0">Unable to load your brief. Please try again.</p>`;
    }
  }

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' }).catch(() => {});
    location.href = '/clients/';
  });

  init();
</script>
<script>
(function(){
  var tok=(document.cookie.split(';').find(function(s){return s.trim().startsWith('fw_session=');})||'').replace(/^\s*fw_session=/,'');
  if(!tok)return;
  var p;try{p=JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));}catch(e){return;}
  if(!p||!p.preview)return;
  var bar=document.createElement('div');
  bar.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#bd7a70;color:#22201d;font-family:Outfit,sans-serif;font-size:13px;font-weight:500;padding:11px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.2);';
  bar.innerHTML='<span style="flex:1;">Previewing portal as <strong>'+(p.name||'client')+'</strong> — do not submit any forms.</span>'
    +'<button onclick="document.cookie=\'fw_session=;expires=Thu,01 Jan 1970 00:00:00 GMT;path=/\';location.href=\'/admin/\';" style="background:rgba(0,0,0,0.18);color:#22201d;border:none;border-radius:6px;padding:6px 14px;font-family:Outfit,sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">Exit preview</button>';
  document.body.prepend(bar);
  document.body.style.paddingTop='44px';
})();
</script>
</body>
</html>
