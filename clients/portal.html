<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Reports — Fairway Investing</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="theme-color" content="#22201d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Outfit',sans-serif;font-weight:300;background:#1a1916;color:#f7f3ed;-webkit-font-smoothing:antialiased;min-height:100vh;}
    a{color:inherit;text-decoration:none;}

    nav{background:#22201d;border-bottom:1px solid rgba(247,243,237,0.08);padding:0 44px;}
    .nav-inner{max-width:1060px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;gap:20px;}
    .nav-logo{display:flex;align-items:center;gap:10px;}
    .nav-user{display:flex;align-items:center;gap:16px;}
    .user-name{font-size:13.5px;font-weight:400;color:rgba(247,243,237,0.5);}
    .logout-btn{font-size:13px;font-weight:400;color:rgba(247,243,237,0.35);padding:8px 16px;border:1px solid rgba(247,243,237,0.1);border-radius:100px;transition:all .2s;cursor:pointer;background:none;}
    .logout-btn:hover{color:rgba(247,243,237,0.7);border-color:rgba(247,243,237,0.2);}

    .hero{padding:56px 44px 40px;max-width:1060px;margin:0 auto;}
    .eyebrow{font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#bd7a70;margin-bottom:12px;}
    h1{font-family:'Fraunces',serif;font-size:40px;font-weight:400;letter-spacing:-0.5px;line-height:1.15;margin-bottom:0;}
    .sub{font-size:16px;font-weight:300;color:rgba(247,243,237,0.45);line-height:1.7;max-width:560px;}

    .grid-wrap{padding:0 44px 80px;max-width:1060px;margin:0 auto;}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
    .card{background:#22201d;border:1px solid rgba(247,243,237,0.09);border-radius:18px;padding:28px 26px;display:flex;flex-direction:column;gap:0;transition:border-color .2s,transform .2s;}
    .card:hover{border-color:rgba(189,122,112,0.35);transform:translateY(-2px);}
    .card-state{font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#bd7a70;margin-bottom:10px;}
    .card-name{font-family:'Fraunces',serif;font-size:24px;font-weight:400;color:#f7f3ed;line-height:1.2;margin-bottom:20px;flex:1;}
    .card-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(189,122,112,0.12);border:1px solid rgba(189,122,112,0.25);border-radius:100px;padding:10px 20px;font-size:13px;font-weight:500;color:#bd7a70;transition:all .2s;width:fit-content;}
    .card-btn:hover{background:rgba(189,122,112,0.2);border-color:rgba(189,122,112,0.5);}

    .empty{padding:80px 44px;text-align:center;}
    .empty h2{font-family:'Fraunces',serif;font-size:26px;font-weight:400;color:rgba(247,243,237,0.4);margin-bottom:12px;}
    .empty p{font-size:15px;font-weight:300;color:rgba(247,243,237,0.25);}

    .actions-wrap{padding:0 44px;max-width:1060px;margin:0 auto 32px;}
    .action-card{background:#22201d;border:1px solid rgba(189,122,112,0.2);border-radius:18px;padding:24px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
    .action-card-left{display:flex;align-items:center;gap:16px;}
    .action-icon{width:44px;height:44px;border-radius:12px;background:rgba(189,122,112,0.1);border:1px solid rgba(189,122,112,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .action-card-text p.ac-label{font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#bd7a70;margin-bottom:4px;}
    .action-card-text p.ac-title{font-family:'Fraunces',serif;font-size:18px;font-weight:400;color:#f7f3ed;margin-bottom:2px;}
    .action-card-text p.ac-sub{font-size:13px;color:rgba(247,243,237,0.35);line-height:1.5;}
    .action-btn{display:inline-flex;align-items:center;gap:8px;background:#bd7a70;border-radius:100px;padding:11px 24px;font-size:13.5px;font-weight:500;color:#f7f3ed;white-space:nowrap;transition:background .2s;flex-shrink:0;}
    .action-btn:hover{background:#c9867d;}
    @media(max-width:640px){.action-card{flex-direction:column;align-items:flex-start;}.action-btn{width:100%;justify-content:center;}}

    .loading{padding:80px 44px;text-align:center;}
    .spinner{width:32px;height:32px;border:2px solid rgba(247,243,237,0.1);border-top-color:#bd7a70;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading p{font-size:14px;font-weight:300;color:rgba(247,243,237,0.3);}

    .section-label{font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:rgba(247,243,237,0.3);margin-bottom:16px;}
    footer{border-top:1px solid rgba(247,243,237,0.06);padding:24px 44px;text-align:center;}
    footer p{font-size:12px;font-weight:300;color:rgba(247,243,237,0.2);}

    @media(max-width:800px){
      nav,footer{padding-left:20px;padding-right:20px;}
      .hero,.grid-wrap,.empty,.loading,.actions-wrap{padding-left:20px;padding-right:20px;}
      .grid{grid-template-columns:1fr 1fr;}
      h1{font-size:30px;}
    }
    @media(max-width:520px){
      .grid{grid-template-columns:1fr;}
      .user-name{display:none;}
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/clients/portal.html" class="nav-logo">
        <img src="/logo-icon.png" alt="" style="height:28px;width:auto;">
        <img src="/logo-word.png" alt="Fairway Investing" style="height:18px;width:auto;">
      </a>
      <div class="nav-user">
        <span class="user-name" id="user-name"></span>
        <button class="logout-btn" id="logout-btn">Sign out</button>
      </div>
    </div>
  </nav>

  <div class="hero">
    <p class="eyebrow">Client portal</p>
    <h1 id="welcome-heading">Welcome back</h1>
  </div>

  <!-- QUESTIONNAIRE CARD (populated by JS) -->
  <div class="actions-wrap" id="q-section"></div>

  <!-- BUYING BRIEF (populated by JS) -->
  <div class="actions-wrap" id="brief-section" style="display:none"></div>

  <!-- PROPERTY PRESENTATIONS (populated by JS) -->
  <div class="grid-wrap" id="presentations-section" style="display:none">
    <p class="section-label">Property presentations</p>
    <div id="presentations-content"></div>
  </div>

  <!-- AREA RESEARCH (populated by JS) -->
  <div class="grid-wrap" id="reports-section" style="display:none">
    <p class="section-label">Area research</p>
    <div id="content"></div>
  </div>

  <footer>
    <p>&copy; 2026 Fairway Investing Pty Ltd &nbsp;&middot;&nbsp; For client use only.</p>
  </footer>

  <script>
    const MARKET_META = {
      'geelong':       { name: 'Geelong',       state: 'VIC' },
      'bendigo':       { name: 'Bendigo',        state: 'VIC' },
      'dubbo':         { name: 'Dubbo',          state: 'NSW' },
      'bacchus-marsh': { name: 'Bacchus Marsh',  state: 'VIC' },
      'devonport':     { name: 'Devonport',      state: 'TAS' },
      'hobart':        { name: 'Hobart',         state: 'TAS' },
      'lara':          { name: 'Lara',           state: 'VIC' },
      'launceston':    { name: 'Launceston',     state: 'TAS' },
      'mackay':        { name: 'Mackay',         state: 'QLD' },
      'melbourne':     { name: 'Melbourne',      state: 'VIC' },
      'newcastle':     { name: 'Newcastle',      state: 'NSW' },
      'rockhampton':   { name: 'Rockhampton',    state: 'QLD' },
      'townsville':    { name: 'Townsville',     state: 'QLD' },
    };

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function renderQSection(completed) {
      const qSec = document.getElementById('q-section');
      if (completed) {
        qSec.innerHTML = `
          <a href="/clients/questionnaire.html" class="action-card" style="border-color:rgba(247,243,237,0.09);">
            <div class="action-card-left">
              <div class="action-icon" style="background:rgba(247,243,237,0.04);border-color:rgba(247,243,237,0.1);">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9l5 5 7-8" stroke="#bd7a70" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <div class="action-card-text">
                <p class="ac-label" style="color:rgba(247,243,237,0.3);">Questionnaire complete</p>
                <p class="ac-title" style="font-size:16px;">Onboarding questionnaire</p>
                <p class="ac-sub">Your answers are on file. Click to review or update them.</p>
              </div>
            </div>
            <span class="action-btn" style="background:transparent;border:1px solid rgba(247,243,237,0.12);color:rgba(247,243,237,0.5);font-weight:400;">Edit answers</span>
          </a>`;
      } else {
        qSec.innerHTML = `
          <a href="/clients/questionnaire.html" class="action-card">
            <div class="action-card-left">
              <div class="action-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 5h12M4 10h8M4 15h10" stroke="#bd7a70" stroke-width="1.6" stroke-linecap="round"/></svg>
              </div>
              <div class="action-card-text">
                <p class="ac-label">Step 1 — Action needed</p>
                <p class="ac-title">Complete your questionnaire</p>
                <p class="ac-sub">Tell us about your goals and financial position so we can get started.</p>
              </div>
            </div>
            <span class="action-btn">Start questionnaire &rarr;</span>
          </a>`;
      }
    }

    function renderBriefSection(qCompleted, briefPublished) {
      const sec = document.getElementById('brief-section');
      if (!qCompleted) {
        // Locked — questionnaire must come first
        sec.style.display = 'block';
        sec.innerHTML = `
          <div class="action-card" style="border-color:rgba(247,243,237,0.07);opacity:0.45;cursor:default;">
            <div class="action-card-left">
              <div class="action-icon" style="background:rgba(247,243,237,0.03);border-color:rgba(247,243,237,0.08);">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="4" width="12" height="11" rx="2" stroke="rgba(247,243,237,0.4)" stroke-width="1.5"/><path d="M6 8h6M6 11h4" stroke="rgba(247,243,237,0.4)" stroke-width="1.4" stroke-linecap="round"/></svg>
              </div>
              <div class="action-card-text">
                <p class="ac-label" style="color:rgba(247,243,237,0.25);">Your buying brief</p>
                <p class="ac-title" style="font-size:16px;color:rgba(247,243,237,0.45);">Complete your questionnaire first</p>
                <p class="ac-sub" style="color:rgba(247,243,237,0.25);">Luke will prepare your buying brief after reviewing your questionnaire.</p>
              </div>
            </div>
          </div>`;
        return;
      }
      sec.style.display = 'block';
      if (briefPublished) {
        sec.innerHTML = `
          <a href="/clients/brief.html" class="action-card">
            <div class="action-card-left">
              <div class="action-icon">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="4" width="12" height="11" rx="2" stroke="#bd7a70" stroke-width="1.5"/><path d="M6 8h6M6 11h4" stroke="#bd7a70" stroke-width="1.4" stroke-linecap="round"/></svg>
              </div>
              <div class="action-card-text">
                <p class="ac-label">Your buying brief</p>
                <p class="ac-title">View your buying brief</p>
                <p class="ac-sub">Your strategy, target markets, budget and parameters — ready to review.</p>
              </div>
            </div>
            <span class="action-btn">View brief &rarr;</span>
          </a>`;
      } else {
        sec.innerHTML = `
          <div class="action-card" style="border-color:rgba(247,243,237,0.09);cursor:default;">
            <div class="action-card-left">
              <div class="action-icon" style="background:rgba(247,243,237,0.04);border-color:rgba(247,243,237,0.1);">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="4" width="12" height="11" rx="2" stroke="rgba(247,243,237,0.35)" stroke-width="1.5"/><path d="M6 8h6M6 11h4" stroke="rgba(247,243,237,0.35)" stroke-width="1.4" stroke-linecap="round"/></svg>
              </div>
              <div class="action-card-text">
                <p class="ac-label" style="color:rgba(247,243,237,0.3);">Your buying brief</p>
                <p class="ac-title" style="font-size:16px;">Being prepared</p>
                <p class="ac-sub">Luke is reviewing your questionnaire and will publish your brief shortly.</p>
              </div>
            </div>
            <span class="action-btn" style="background:transparent;border:1px solid rgba(247,243,237,0.1);color:rgba(247,243,237,0.3);font-weight:400;cursor:default;">Coming soon</span>
          </div>`;
      }
    }

    function renderReports(markets) {
      const section = document.getElementById('reports-section');
      const content = document.getElementById('content');
      if (!markets || markets.length === 0) return; // section stays hidden
      section.style.display = 'block';
      const cards = markets.map(key => {
        const meta = MARKET_META[key] || { name: key, state: '' };
        return `<a href="/reports/${key}.html" class="card">
          <p class="card-state">${esc(meta.state)} &nbsp;&middot;&nbsp; Area report</p>
          <p class="card-name">${esc(meta.name)}</p>
          <span class="card-btn">View report &rarr;</span>
        </a>`;
      }).join('');
      content.innerHTML = `<div class="grid">${cards}</div>`;
    }

    function renderPresentations(items) {
      const section = document.getElementById('presentations-section');
      const content = document.getElementById('presentations-content');
      if (!items || items.length === 0) return;
      section.style.display = 'block';

      const typeLabels = { house:'House', unit:'Unit', townhouse:'Townhouse', duplex:'Duplex', land:'Land' };
      const statusText = { offer:'Under Offer', sold:'Sold', available:'Available' };
      const statusCol  = { offer:'#e8a87c', sold:'#f08080', available:'#6dbf7b' };

      const cards = items.map(p => {
        const type = typeLabels[p.propertyType] || 'Property';
        const statusSuffix = p.status && statusText[p.status]
          ? ` <span style="color:${statusCol[p.status]}">&middot;&nbsp;${statusText[p.status]}</span>`
          : '';
        const metaParts = [p.suburb && esc(p.suburb), p.price && esc(p.price)].filter(Boolean);
        const meta = metaParts.join(' &nbsp;&middot;&nbsp; ');
        return `<a href="/p/property.html?t=${encodeURIComponent(p.token)}" class="card">
          <p class="card-state">${esc(type)}${statusSuffix}</p>
          <div style="flex:1;">
            <p style="font-family:'Fraunces',serif;font-size:22px;font-weight:400;color:#f7f3ed;line-height:1.2;margin-bottom:${meta ? '8px' : '0'};">${esc(p.address)}</p>
            ${meta ? `<p style="font-size:13px;color:rgba(247,243,237,0.35);margin:0;">${meta}</p>` : ''}
          </div>
          <span class="card-btn" style="margin-top:20px;">View presentation &rarr;</span>
        </a>`;
      }).join('');

      content.innerHTML = `<div class="grid">${cards}</div>`;
    }

    async function init() {
      let me;
      try {
        const res = await fetch('/api/me');
        if (!res.ok) { location.href = '/clients/'; return; }
        me = await res.json();
      } catch { location.href = '/clients/'; return; }

      document.getElementById('user-name').textContent = me.name;
      document.getElementById('welcome-heading').textContent = `Welcome back, ${me.name.split(' ')[0]}.`;

      // Fetch questionnaire, brief and presentations in parallel
      let qCompleted = false;
      let briefPublished = false;
      let presentations = [];
      try {
        const [qr, br, pr] = await Promise.all([
          fetch('/api/submit-questionnaire'),
          fetch('/api/brief'),
          fetch('/api/presentations'),
        ]);
        if (qr.ok) { const qd = await qr.json(); qCompleted = qd.completed === true; }
        if (br.ok) { const bd = await br.json(); briefPublished = bd.published === true; }
        if (pr.ok) {
          const pd = await pr.json();
          presentations = pd.presentations || [];
          console.log('[portal] presentations response:', pd);
        } else {
          console.error('[portal] /api/presentations returned', pr.status);
        }
      } catch (e) { console.error('[portal] fetch error', e); }

      renderQSection(qCompleted);
      renderBriefSection(qCompleted, briefPublished);
      renderPresentations(presentations);
      renderReports(me.markets);
    }

    document.getElementById('logout-btn').addEventListener('click', async function() {
      await fetch('/api/logout', { method: 'POST' });
      location.href = '/clients/';
    });

    init();
  </script>
</body>
</html>
