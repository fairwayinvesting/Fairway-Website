<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Reports — Fairway Investing</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="theme-color" content="#22201d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Outfit',sans-serif;font-weight:300;background:#1a1916;color:#f7f3ed;-webkit-font-smoothing:antialiased;min-height:100vh;}
    a{color:inherit;text-decoration:none;}

    nav{background:#22201d;border-bottom:1px solid rgba(247,243,237,0.08);padding:0 44px;}
    .nav-inner{max-width:1060px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;gap:20px;}
    .nav-logo{display:flex;align-items:center;gap:10px;}
    .nav-user{display:flex;align-items:center;gap:16px;}
    .user-name{font-size:13.5px;font-weight:400;color:rgba(247,243,237,0.5);}
    .logout-btn{font-size:13px;font-weight:400;color:rgba(247,243,237,0.35);padding:8px 16px;border:1px solid rgba(247,243,237,0.1);border-radius:100px;transition:all .2s;cursor:pointer;background:none;}
    .logout-btn:hover{color:rgba(247,243,237,0.7);border-color:rgba(247,243,237,0.2);}

    .hero{padding:56px 44px 40px;max-width:1060px;margin:0 auto;}
    .eyebrow{font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#bd7a70;margin-bottom:12px;}
    h1{font-family:'Fraunces',serif;font-size:40px;font-weight:400;letter-spacing:-0.5px;line-height:1.15;margin-bottom:0;}
    .sub{font-size:16px;font-weight:300;color:rgba(247,243,237,0.45);line-height:1.7;max-width:560px;}

    .grid-wrap{padding:0 44px 80px;max-width:1060px;margin:0 auto;}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
    .card{background:#22201d;border:1px solid rgba(247,243,237,0.09);border-radius:18px;padding:28px 26px;display:flex;flex-direction:column;gap:0;transition:border-color .2s,transform .2s;}
    .card:hover{border-color:rgba(189,122,112,0.35);transform:translateY(-2px);}
    .card-state{font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#bd7a70;margin-bottom:10px;}
    .card-name{font-family:'Fraunces',serif;font-size:24px;font-weight:400;color:#f7f3ed;line-height:1.2;margin-bottom:20px;flex:1;}
    .card-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(189,122,112,0.12);border:1px solid rgba(189,122,112,0.25);border-radius:100px;padding:10px 20px;font-size:13px;font-weight:500;color:#bd7a70;transition:all .2s;width:fit-content;}
    .card-btn:hover{background:rgba(189,122,112,0.2);border-color:rgba(189,122,112,0.5);}

    .empty{padding:80px 44px;text-align:center;}
    .empty h2{font-family:'Fraunces',serif;font-size:26px;font-weight:400;color:rgba(247,243,237,0.4);margin-bottom:12px;}
    .empty p{font-size:15px;font-weight:300;color:rgba(247,243,237,0.25);}

    .actions-wrap{padding:0 44px;max-width:1060px;margin:0 auto 32px;}
    .action-card{background:#22201d;border:1px solid rgba(189,122,112,0.2);border-radius:18px;padding:24px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
    .action-card-left{display:flex;align-items:center;gap:16px;}
    .action-icon{width:44px;height:44px;border-radius:12px;background:rgba(189,122,112,0.1);border:1px solid rgba(189,122,112,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .action-card-text p.ac-label{font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#bd7a70;margin-bottom:4px;}
    .action-card-text p.ac-title{font-family:'Fraunces',serif;font-size:18px;font-weight:400;color:#f7f3ed;margin-bottom:2px;}
    .action-card-text p.ac-sub{font-size:13px;color:rgba(247,243,237,0.35);line-height:1.5;}
    .action-btn{display:inline-flex;align-items:center;gap:8px;background:#bd7a70;border-radius:100px;padding:11px 24px;font-size:13.5px;font-weight:500;color:#f7f3ed;white-space:nowrap;transition:background .2s;flex-shrink:0;}
    .action-btn:hover{background:#c9867d;}
    @media(max-width:640px){.action-card{flex-direction:column;align-items:flex-start;}.action-btn{width:100%;justify-content:center;}}

    .loading{padding:80px 44px;text-align:center;}
    .spinner{width:32px;height:32px;border:2px solid rgba(247,243,237,0.1);border-top-color:#bd7a70;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading p{font-size:14px;font-weight:300;color:rgba(247,243,237,0.3);}

    .section-label{font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:rgba(247,243,237,0.3);margin-bottom:16px;}
    footer{border-top:1px solid rgba(247,243,237,0.06);padding:24px 44px;text-align:center;}
    footer p{font-size:12px;font-weight:300;color:rgba(247,243,237,0.2);}

    /* Journey progress bar */
    /* Settlement countdown */
    .settlement-wrap{padding:0 44px 24px;max-width:1060px;margin:0 auto;}
    .settlement-card{background:#22201d;border:1px solid rgba(189,122,112,0.22);border-radius:18px;padding:24px 28px;display:flex;align-items:center;gap:24px;}
    .settlement-days{font-family:'Fraunces',serif;font-size:52px;font-weight:400;color:#f7f3ed;line-height:1;flex-shrink:0;min-width:80px;}
    .settlement-days.urgent{color:#e8a87c;}
    .settlement-days.past{color:rgba(247,243,237,0.3);}
    .settlement-text p{margin:0;line-height:1.4;}
    .settlement-eyebrow{font-size:10.5px;font-weight:600;letter-spacing:0.13em;text-transform:uppercase;color:#bd7a70;margin-bottom:5px!important;}
    .settlement-label{font-family:'Fraunces',serif;font-size:19px;font-weight:400;color:#f7f3ed;}
    .settlement-date{font-size:13px;color:rgba(247,243,237,0.4);margin-top:4px!important;}
    @media(max-width:520px){.settlement-card{flex-direction:column;align-items:flex-start;gap:12px;}.settlement-days{font-size:42px;}}

    .journey-wrap{padding:0 44px 32px;max-width:1060px;margin:0 auto;}
    .journey-bar{display:flex;align-items:flex-start;gap:0;}
    .jstep{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;position:relative;}
    .jstep:not(:last-child)::after{content:'';position:absolute;top:10px;left:calc(50% + 12px);right:calc(-50% + 12px);height:1.5px;background:rgba(247,243,237,0.1);}
    .jstep.done:not(:last-child)::after,.jstep.active:not(:last-child)::after,.jstep.pending:not(:last-child)::after{background:rgba(189,122,112,0.35);}
    .jstep.pending .jstep-dot{background:transparent;border-color:#bd7a70;border-width:2px;}
    .jstep-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(247,243,237,0.15);background:transparent;flex-shrink:0;margin-bottom:8px;transition:all .2s;position:relative;z-index:1;}
    .jstep.done .jstep-dot{background:#bd7a70;border-color:#bd7a70;}
    .jstep.done .jstep-dot::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:600;}
    .jstep.active .jstep-dot{background:#bd7a70;border-color:#bd7a70;box-shadow:0 0 0 4px rgba(189,122,112,0.18);}
    .jstep-label{font-size:11px;font-weight:400;color:rgba(247,243,237,0.25);text-align:center;line-height:1.3;padding:0 6px;}
    .jstep.done .jstep-label{color:rgba(247,243,237,0.45);}
    .jstep.active .jstep-label{color:#f7f3ed;font-weight:500;}
    @media(max-width:520px){
      .journey-wrap{padding-left:20px;padding-right:20px;}
      .jstep-label{font-size:10px;}
    }

    /* Portfolio mode */
    .portfolio-wrap{padding:0 44px 40px;max-width:1060px;margin:0 auto;}
    .portfolio-heading{font-family:'Fraunces',serif;font-size:22px;font-weight:400;color:#f7f3ed;margin-bottom:18px;}
    .prop-card{background:#22201d;border:1px solid rgba(247,243,237,0.09);border-radius:18px;padding:24px 28px;margin-bottom:16px;}
    .prop-card-header{margin-bottom:16px;}
    .prop-card-address{font-family:'Fraunces',serif;font-size:20px;font-weight:400;color:#f7f3ed;line-height:1.2;margin-bottom:4px;}
    .prop-card-sub{font-size:13px;color:rgba(247,243,237,0.35);}
    .prop-equity{background:rgba(109,191,123,0.07);border:1px solid rgba(109,191,123,0.18);border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;}
    .prop-equity.neg{background:rgba(240,128,128,0.07);border-color:rgba(240,128,128,0.18);}
    .prop-equity-label{font-size:10.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(247,243,237,0.35);margin-bottom:3px;}
    .prop-equity-value{font-family:'Fraunces',serif;font-size:26px;color:#6dbf7b;line-height:1;}
    .prop-equity.neg .prop-equity-value{color:#f08080;}
    .prop-equity-sub{font-size:12px;color:rgba(247,243,237,0.3);}
    .prop-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
    .prop-field label{display:block;font-size:10px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:rgba(247,243,237,0.25);margin-bottom:3px;}
    .prop-field .pfv{font-size:14px;color:#f7f3ed;}
    .prop-section-label{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(247,243,237,0.25);padding-top:14px;border-top:1px solid rgba(247,243,237,0.06);margin-bottom:12px;}
    .prop-edit-btn{font-family:'Outfit',sans-serif;font-size:12.5px;font-weight:400;color:#bd7a70;background:none;border:1px solid rgba(189,122,112,0.25);border-radius:100px;padding:6px 14px;cursor:pointer;transition:all .15s;}
    .prop-edit-btn:hover{background:rgba(189,122,112,0.08);}
    .prop-edit-form{background:rgba(247,243,237,0.03);border:1px solid rgba(247,243,237,0.09);border-radius:12px;padding:16px 18px;margin-top:14px;display:none;}
    .prop-edit-form.open{display:block;}
    .prop-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
    .prop-edit-grid .field label{font-size:11px;color:rgba(247,243,237,0.4);}
    .prop-edit-grid .field input,.prop-edit-grid .field select{width:100%;background:rgba(247,243,237,0.05);border:1px solid rgba(247,243,237,0.12);border-radius:8px;padding:9px 12px;font-size:13px;font-family:'Outfit',sans-serif;font-weight:300;color:#f7f3ed;outline:none;}
    .prop-edit-grid .field input:focus,.prop-edit-grid .field select:focus{border-color:rgba(189,122,112,0.5);}

    @media(max-width:800px){
      nav,footer{padding-left:20px;padding-right:20px;}
      .hero,.grid-wrap,.empty,.loading,.actions-wrap,.portfolio-wrap,.journey-wrap,.settlement-wrap{padding-left:20px;padding-right:20px;}
      .grid{grid-template-columns:1fr 1fr;}
      h1{font-size:30px;}
    }
    @media(max-width:520px){
      .grid{grid-template-columns:1fr;}
      .user-name{display:none;}
      .prop-fields{grid-template-columns:1fr 1fr;}
      .prop-equity{flex-direction:column;align-items:flex-start;gap:8px;}
    }

    /* Multi-acquisition panels */
    .acq-panel{background:#22201d;border:1px solid rgba(247,243,237,0.09);border-radius:20px;margin-bottom:20px;overflow:hidden;transition:border-color .2s;}
    .acq-panel-head{padding:24px 28px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:background .15s;}
    .acq-panel-head:hover{background:rgba(247,243,237,0.02);}
    .acq-panel-number{font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#bd7a70;margin-bottom:4px;}
    .acq-panel-label{font-family:'Fraunces',serif;font-size:22px;font-weight:400;color:#f7f3ed;line-height:1.2;}
    .acq-panel-stage{font-size:13px;color:rgba(247,243,237,0.35);margin-top:2px;}
    .acq-panel-chevron{margin-left:auto;color:rgba(247,243,237,0.25);transition:transform .2s;flex-shrink:0;}
    .acq-panel.open .acq-panel-chevron{transform:rotate(180deg);}
    .acq-panel-body{display:none;border-top:1px solid rgba(247,243,237,0.07);}
    .acq-panel.open .acq-panel-body{display:block;}
    .acq-section{padding:24px 28px;border-bottom:1px solid rgba(247,243,237,0.06);}
    .acq-section:last-child{border-bottom:none;}
    .acq-section-label{font-size:10.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(247,243,237,0.28);margin-bottom:14px;}
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/clients/portal.html" class="nav-logo">
        <img src="/logo-icon.png" alt="" style="height:28px;width:auto;">
        <img src="/logo-word.png" alt="Fairway Investing" style="height:18px;width:auto;">
      </a>
      <div class="nav-user">
        <span class="user-name" id="user-name"></span>
        <button class="logout-btn" id="logout-btn">Sign out</button>
      </div>
    </div>
  </nav>

  <div class="hero">
    <p class="eyebrow">Client portal</p>
    <h1 id="welcome-heading">Welcome back</h1>
  </div>

  <!-- SETTLEMENT COUNTDOWN (populated by JS, hidden until settlement date set) -->
  <div class="settlement-wrap" id="settlement-section" style="display:none">
    <div class="settlement-card" id="settlement-card"></div>
  </div>

  <!-- JOURNEY PROGRESS (populated by JS, hidden until stage is set) -->
  <div class="journey-wrap" id="journey-section" style="display:none">
    <div class="journey-bar" id="journey-bar"></div>
  </div>

  <!-- STAGE STATUS BANNER (populated by JS, shown for searching/under_contract/exchanged) -->
  <div class="actions-wrap" id="status-section" style="display:none"></div>

  <!-- QUESTIONNAIRE CARD (populated by JS) -->
  <div class="actions-wrap" id="q-section"></div>

  <!-- BUYING BRIEF (populated by JS) -->
  <div class="actions-wrap" id="brief-section" style="display:none"></div>

  <!-- PROPERTY PRESENTATIONS (populated by JS) -->
  <div class="grid-wrap" id="presentations-section" style="display:none">
    <p class="section-label">Property presentations</p>
    <div id="presentations-content"></div>
  </div>

  <!-- AREA RESEARCH (populated by JS) -->
  <div class="grid-wrap" id="reports-section" style="display:none">
    <p class="section-label">Area research</p>
    <div id="content"></div>
  </div>

  <!-- MY PORTFOLIO (shown for completed/re-engaged clients with purchases) -->
  <div class="portfolio-wrap" id="portfolio-section" style="display:none">
    <p class="section-label">My portfolio</p>
    <div id="portfolio-content"></div>
  </div>

  <footer>
    <p>&copy; 2026 Fairway Investing Pty Ltd &nbsp;&middot;&nbsp; For client use only.</p>
  </footer>

  <script>
    const MARKET_META = {
      'geelong':       { name: 'Geelong',       state: 'VIC' },
      'bendigo':       { name: 'Bendigo',        state: 'VIC' },
      'dubbo':         { name: 'Dubbo',          state: 'NSW' },
      'bacchus-marsh': { name: 'Bacchus Marsh',  state: 'VIC' },
      'devonport':     { name: 'Devonport',      state: 'TAS' },
      'hobart':        { name: 'Hobart',         state: 'TAS' },
      'lara':          { name: 'Lara',           state: 'VIC' },
      'launceston':    { name: 'Launceston',     state: 'TAS' },
      'mackay':        { name: 'Mackay',         state: 'QLD' },
      'melbourne':     { name: 'Melbourne',      state: 'VIC' },
      'newcastle':     { name: 'Newcastle',      state: 'NSW' },
      'rockhampton':   { name: 'Rockhampton',    state: 'QLD' },
      'townsville':    { name: 'Townsville',     state: 'QLD' },
    };

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    const JOURNEY_STAGES = [
      { key: 'onboarding',     label: 'Onboarding' },
      { key: 'searching',      label: 'Searching' },
      { key: 'under_contract', label: 'Under contract' },
      { key: 'exchanged',      label: 'Unconditional' },
      { key: 'settlement',     label: 'Settled' },
    ];

    function renderSettlement(dateStr) {
      if (!dateStr) return;
      const wrap = document.getElementById('settlement-section');
      const card = document.getElementById('settlement-card');
      const today = new Date(); today.setHours(0,0,0,0);
      const settle = new Date(dateStr + 'T00:00:00');
      const days = Math.round((settle - today) / 86400000);
      const fmt = settle.toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
      let daysHTML, labelHTML, urgent = '';
      if (days > 0) {
        if (days <= 14) urgent = ' urgent';
        daysHTML = `<div class="settlement-days${urgent}">${days}</div>`;
        labelHTML = `<p class="settlement-eyebrow">Settlement countdown</p>
          <p class="settlement-label">${days === 1 ? '1 day' : days + ' days'} to settlement</p>
          <p class="settlement-date">${fmt}</p>`;
      } else if (days === 0) {
        daysHTML = `<div class="settlement-days urgent">Today</div>`;
        labelHTML = `<p class="settlement-eyebrow">Settlement</p>
          <p class="settlement-label">Settlement is today</p>
          <p class="settlement-date">${fmt}</p>`;
      } else {
        daysHTML = `<div class="settlement-days past">✓</div>`;
        labelHTML = `<p class="settlement-eyebrow">Settled</p>
          <p class="settlement-label">Congratulations!</p>
          <p class="settlement-date">Settled on ${fmt}</p>`;
      }
      card.innerHTML = `${daysHTML}<div class="settlement-text">${labelHTML}</div>`;
      wrap.style.display = 'block';
    }

    function renderJourney(stage, settlementDate) {
      if (!stage) return;
      const wrap = document.getElementById('journey-section');
      const bar  = document.getElementById('journey-bar');
      const idx  = JOURNEY_STAGES.findIndex(s => s.key === stage);
      if (idx === -1) return;

      // Settlement is "pending" (line filled but node not done) until the date passes
      const settleDate = settlementDate ? new Date(settlementDate + 'T00:00:00') : null;
      const today = new Date(); today.setHours(0,0,0,0);
      const settlePast = settleDate ? settleDate <= today : false;

      bar.innerHTML = JOURNEY_STAGES.map((s, i) => {
        let cls;
        if (i < idx) {
          cls = 'done';
        } else if (i === idx) {
          if (s.key === 'settlement' && !settlePast) {
            cls = 'active pending';
          } else {
            cls = 'active';
          }
        } else {
          cls = '';
        }
        return `<div class="jstep ${cls}">
          <div class="jstep-dot"></div>
          <div class="jstep-label">${s.label}</div>
        </div>`;
      }).join('');
      wrap.style.display = 'block';
    }

    function renderQSection(completed) {
      const qSec = document.getElementById('q-section');
      if (completed) {
        qSec.innerHTML = `
          <a href="/clients/questionnaire.html" class="action-card" style="border-color:rgba(247,243,237,0.09);">
            <div class="action-card-left">
              <div class="action-icon" style="background:rgba(247,243,237,0.04);border-color:rgba(247,243,237,0.1);">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9l5 5 7-8" stroke="#bd7a70" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <div class="action-card-text">
                <p class="ac-label" style="color:rgba(247,243,237,0.3);">Questionnaire complete</p>
                <p class="ac-title" style="font-size:16px;">Onboarding questionnaire</p>
                <p class="ac-sub">Your answers are on file. Click to review or update them.</p>
              </div>
            </div>
            <span class="action-btn" style="background:transparent;border:1px solid rgba(247,243,237,0.12);color:rgba(247,243,237,0.5);font-weight:400;">Edit answers</span>
          </a>`;
      } else {
        qSec.innerHTML = `
          <a href="/clients/questionnaire.html" class="action-card">
            <div class="action-card-left">
              <div class="action-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 5h12M4 10h8M4 15h10" stroke="#bd7a70" stroke-width="1.6" stroke-linecap="round"/></svg>
              </div>
              <div class="action-card-text">
                <p class="ac-label">Step 1 — Action needed</p>
                <p class="ac-title">Complete your questionnaire</p>
                <p class="ac-sub">Tell us about your goals and financial position so we can get started.</p>
              </div>
            </div>
            <span class="action-btn">Start questionnaire &rarr;</span>
          </a>`;
      }
    }

    function renderStatusBanner(stage, qCompleted) {
      const sec = document.getElementById('status-section');
      if (!sec || !qCompleted) return;
      const msgs = {
        searching: {
          label: 'Currently searching',
          title: 'Luke is searching the market for you',
          sub: 'We\'ll email you as soon as we find a property that matches your brief.',

    function renderPresentations(items) {

      const content = document.getElementById('presentations-content');

    const LOAN_TYPE_LABELS = { variable:'Variable P&I', fixed:'Fixed P&I', 'io-variable':'Variable IO', 'io-fixed':'Fixed IO', split:'Split' };

    function fmtMoney(v) {
      const n = parseFloat(String(v || '').replace(/[^0-9.]/g,''));
      return isNaN(n) ? '—' : '$' + n.toLocaleString();
    }

    function renderPortfolio(purchases) {
      const sec = document.getElementById('portfolio-section');
      const content = document.getElementById('portfolio-content');
      if (!purchases || !purchases.length) return;
      sec.style.display = 'block';
      content.innerHTML = purchases.map(p => {
        const currVal = parseFloat(String(p.currentValue || '').replace(/[^0-9.]/g,'')) || 0;
        const loan    = parseFloat(String(p.loanAmount  || '').replace(/[^0-9.]/g,'')) || 0;
        const equity  = currVal - loan;
        const hasEquity = currVal > 0 && loan > 0;
        const lvr = currVal > 0 ? Math.round(loan / currVal * 100) : 0;

        return `<div class="prop-card" id="prop-card-${p.id}">
          <div class="prop-card-header">
            <div class="prop-card-address">${esc(p.address)}</div>
            <div class="prop-card-sub">${[p.suburb, p.state].filter(Boolean).map(esc).join(', ')}${p.propertyType ? ' &nbsp;·&nbsp; ' + esc(p.propertyType.charAt(0).toUpperCase() + p.propertyType.slice(1)) : ''}</div>
          </div>

          ${hasEquity ? `<div class="prop-equity${equity < 0 ? ' neg' : ''}">
            <div>
              <div class="prop-equity-label">Estimated equity</div>
              <div class="prop-equity-value">$${Math.abs(equity).toLocaleString()}</div>
            </div>
            <div style="text-align:right;">
              <div class="prop-equity-sub">${fmtMoney(p.currentValue)} current value</div>
              <div class="prop-equity-sub">${lvr}% LVR &nbsp;·&nbsp; ${fmtMoney(p.loanAmount)} loan</div>
            </div>
          </div>` : ''}

          <div class="prop-fields">
            <div class="prop-field"><label>Purchase price</label><div class="pfv">${fmtMoney(p.purchasePrice)}</div></div>
            <div class="prop-field"><label>Current value</label><div class="pfv">${fmtMoney(p.currentValue)}</div></div>
            <div class="prop-field"><label>Interest rate</label><div class="pfv">${esc(p.interestRate || '—')}</div></div>
            <div class="prop-field"><label>Loan type</label><div class="pfv">${LOAN_TYPE_LABELS[p.loanType] || p.loanType || '—'}</div></div>
            <div class="prop-field"><label>Loan term</label><div class="pfv">${p.loanTerm ? esc(p.loanTerm) + ' years' : '—'}</div></div>
            <div class="prop-field"><label>Lender</label><div class="pfv">${esc(p.lender || '—')}</div></div>
          </div>

          ${p.pmName ? `<div class="prop-section-label">Property management</div>
          <div class="prop-fields" style="margin-bottom:18px;">
            <div class="prop-field"><label>Manager</label><div class="pfv">${esc(p.pmName)}</div></div>
            <div class="prop-field"><label>Agency</label><div class="pfv">${esc(p.pmAgency || '—')}</div></div>
            <div class="prop-field"><label>Phone</label><div class="pfv">${p.pmPhone ? `<a href="tel:${esc(p.pmPhone)}" style="color:#bd7a70;">${esc(p.pmPhone)}</a>` : '—'}</div></div>
            <div class="prop-field"><label>Email</label><div class="pfv">${p.pmEmail ? `<a href="mailto:${esc(p.pmEmail)}" style="color:#bd7a70;">${esc(p.pmEmail)}</a>` : '—'}</div></div>
            <div class="prop-field"><label>Weekly rent</label><div class="pfv">${esc(p.weeklyRent || '—')}</div></div>
            <div class="prop-field"><label>Management fee</label><div class="pfv">${esc(p.managementFee || '—')}</div></div>
          </div>` : ''}

          ${p.brokerName ? `<div class="prop-section-label">Broker</div>
          <div class="prop-fields" style="margin-bottom:18px;">
            <div class="prop-field"><label>Name</label><div class="pfv">${esc(p.brokerName)}</div></div>
            <div class="prop-field"><label>Company</label><div class="pfv">${esc(p.brokerCompany || '—')}</div></div>
            <div class="prop-field"><label>Phone</label><div class="pfv">${p.brokerPhone ? `<a href="tel:${esc(p.brokerPhone)}" style="color:#bd7a70;">${esc(p.brokerPhone)}</a>` : '—'}</div></div>
            <div class="prop-field"><label>Email</label><div class="pfv">${p.brokerEmail ? `<a href="mailto:${esc(p.brokerEmail)}" style="color:#bd7a70;">${esc(p.brokerEmail)}</a>` : '—'}</div></div>
          </div>` : ''}

          <button class="prop-edit-btn" onclick="togglePropEdit('${p.id}')">Update loan details</button>
          <div class="prop-edit-form" id="prop-edit-${p.id}">
            <p style="font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(247,243,237,0.3);margin-bottom:14px;">Update your loan details</p>
            <div class="prop-edit-grid">
              <div class="field"><label>Loan amount</label><input type="text" id="pe-loan-${p.id}" value="${esc(p.loanAmount || '')}" placeholder="$520,000"></div>
              <div class="field"><label>Interest rate</label><input type="text" id="pe-rate-${p.id}" value="${esc(p.interestRate || '')}" placeholder="6.14%"></div>
              <div class="field"><label>Loan term (years)</label><input type="text" id="pe-term-${p.id}" value="${esc(p.loanTerm || '')}" placeholder="30"></div>
              <div class="field"><label>Loan type</label>
                <select id="pe-type-${p.id}">
                  <option value="variable" ${p.loanType==='variable'?'selected':''}>Variable P&amp;I</option>
                  <option value="fixed" ${p.loanType==='fixed'?'selected':''}>Fixed P&amp;I</option>
                  <option value="io-variable" ${p.loanType==='io-variable'?'selected':''}>Variable IO</option>
                  <option value="io-fixed" ${p.loanType==='io-fixed'?'selected':''}>Fixed IO</option>
                  <option value="split" ${p.loanType==='split'?'selected':''}>Split</option>

            <div style="display:flex;gap:8px;">
              <button onclick="savePropEdit('${p.id}')" style="font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;background:#bd7a70;color:#f7f3ed;border:none;border-radius:100px;padding:9px 20px;cursor:pointer;">Save</button>
              <button onclick="togglePropEdit('${p.id}')" style="font-family:'Outfit',sans-serif;font-size:13px;background:none;border:1px solid rgba(247,243,237,0.12);color:rgba(247,243,237,0.5);border-radius:100px;padding:9px 16px;cursor:pointer;">Cancel</button>

          </div>
        </div>`;

    function togglePropEdit(id) {
      const form = document.getElementById('prop-edit-' + id);
      form.classList.toggle('open');
    }

    async function savePropEdit(id) {
      const body = {
        id,
        loanAmount:   document.getElementById('pe-loan-' + id).value.trim(),
        interestRate: document.getElementById('pe-rate-' + id).value.trim(),
        loanTerm:     document.getElementById('pe-term-' + id).value.trim(),
        loanType:     document.getElementById('pe-type-' + id).value,
      };
      try {
        const res = await fetch('/api/client/properties', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (res.ok) {
          // Re-fetch and re-render portfolio
          const pr = await fetch('/api/client/properties');
          if (pr.ok) { renderPortfolio(await pr.json()); }
        } else { alert('Save failed. Please try again.'); }
      } catch { alert('Network error. Please try again.'); }
    }

    const ACQ_STAGE_LABELS = { onboarding:'Onboarding', searching:'Searching', under_contract:'Under contract', exchanged:'Unconditional', settlement:'Settled' };

    function renderMultiAcquisition(acquisitions, me) {
      // Hide single-acquisition sections
      document.getElementById('q-section').style.display = 'none';
      document.getElementById('brief-section').style.display = 'none';
      document.getElementById('reports-section').style.display = 'none';
      document.getElementById('journey-section').style.display = 'none';
      document.getElementById('settlement-section').style.display = 'none';
      document.getElementById('presentations-section').style.display = 'none';

      // Insert acquisitions container after the hero
      const hero = document.querySelector('.hero');
      let container = document.getElementById('multi-acq-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'multi-acq-container';
        container.style.cssText = 'padding:0 44px 40px;max-width:1060px;margin:0 auto;';
        hero.insertAdjacentElement('afterend', container);
      }

      container.innerHTML = acquisitions.map((acq, i) => {
        const stageLabel = ACQ_STAGE_LABELS[acq.pipelineStage] || 'Getting started';
        const today = new Date(); today.setHours(0,0,0,0);
        const settleDate = acq.settlementDate ? new Date(acq.settlementDate + 'T00:00:00') : null;
        const settlePast = settleDate ? settleDate <= today : false;
        const days = settleDate && !settlePast ? Math.round((settleDate - today) / 86400000) : null;
        const isSettled = acq.status === 'settled' || (acq.pipelineStage === 'settlement' && settlePast);
        const panelLabel = isSettled ? 'Settled'
          : acq.pipelineStage === 'settlement' ? 'Settling soon'
          : 'In progress';

        const stages = ['onboarding','searching','under_contract','exchanged','settlement'];
        const stageIdx = stages.indexOf(acq.pipelineStage);
        const journeyHTML = acq.pipelineStage ? `
          <div class="acq-section">
            <p class="acq-section-label">Journey</p>
            <div class="journey-bar" style="margin-bottom:0;">
              ${stages.map((sk, si) => {
                let cls;
                if (si < stageIdx) cls = 'done';
                else if (si === stageIdx) cls = (sk === 'settlement' && !settlePast) ? 'active pending' : 'active';
                else cls = '';
                return `<div class="jstep ${cls}"><div class="jstep-dot"></div><div class="jstep-label">${ACQ_STAGE_LABELS[sk]}</div></div>`;
              }).join('')}
            </div>
            ${days !== null ? `<div class="settlement-card" style="margin-top:18px;padding:16px 20px;">
              <div class="settlement-days${days <= 14 ? ' urgent' : ''}" style="font-size:38px;">${days}</div>
              <div class="settlement-text">
                <p class="settlement-eyebrow">Settlement countdown</p>
                <p class="settlement-label">${days} day${days !== 1 ? 's' : ''} to settlement</p>
                <p class="settlement-date">${settleDate.toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})}</p>
              </div>
            </div>` : ''}
          </div>` : '';

        const qSection = `<div class="acq-section">
          <p class="acq-section-label">Questionnaire</p>
          ${acq.questionnaireSubmitted
            ? `<p style="font-size:13.5px;color:rgba(247,243,237,0.55);">Complete &#10003;</p>`
            : `<a href="/clients/questionnaire.html${acq.number > 1 ? '?acq=' + acq.id : ''}" class="action-btn" style="display:inline-flex;">Complete questionnaire &rarr;</a>`}
        </div>`;

        const briefSection = acq.briefPublished ? `<div class="acq-section">
          <p class="acq-section-label">Buying brief</p>
          <a href="/clients/brief.html${acq.number > 1 ? '?acq=' + acq.id : ''}" class="action-btn" style="display:inline-flex;">View buying brief &rarr;</a>
        </div>` : '';

        const reportsSection = acq.markets && acq.markets.length > 0 ? `<div class="acq-section">
          <p class="acq-section-label">Area research</p>
          <div class="grid">${acq.markets.map(key => {
            const meta = MARKET_META[key] || { name: key, state: '' };
            return `<a href="/reports/${key}.html" class="card" style="padding:20px;">
              <p class="card-state">${esc(meta.state)} &nbsp;&middot;&nbsp; Area report</p>
              <p class="card-name" style="font-size:18px;">${esc(meta.name)}</p>
              <span class="card-btn">View &rarr;</span>
            </a>`;
          }).join('')}</div>
        </div>` : '';

        return `<div class="acq-panel${i === 0 ? ' open' : ''}" id="acq-panel-${acq.id}">
          <div class="acq-panel-head" onclick="toggleAcqPanel('${acq.id}')">
            <div>
              <p class="acq-panel-number">${esc(acq.label)}</p>
              <p class="acq-panel-label">${panelLabel}</p>
              <p class="acq-panel-stage">${stageLabel}${days !== null ? ` &nbsp;&middot;&nbsp; ${days} days to settlement` : ''}</p>
            </div>
            <svg class="acq-panel-chevron" width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 7.5l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="acq-panel-body">
            ${journeyHTML}
            ${qSection}
            ${briefSection}
            ${reportsSection}
          </div>
        </div>`;
      }).join('');

      // Also load presentations per acquisition
      fetch('/api/presentations').then(r => r.ok ? r.json() : {presentations:[]}).then(({ presentations: pres }) => {
        if (!pres || !pres.length) return;
        acquisitions.forEach(acq => {
          const acqPres = pres.filter(p => p.acquisitionId === acq.id || (!p.acquisitionId && acq.number === 1));
          if (!acqPres.length) return;
          const panel = document.getElementById('acq-panel-' + acq.id);
          if (!panel) return;
          const body = panel.querySelector('.acq-panel-body');
          const typeLabels = { house:'House', unit:'Unit', townhouse:'Townhouse', duplex:'Duplex', land:'Land' };
          const presHTML = `<div class="acq-section">
            <p class="acq-section-label">Property presentations</p>
            <div class="grid">${acqPres.map(p => {
              return `<a href="/p/property.html?t=${encodeURIComponent(p.token)}" class="card" style="padding:20px;">
                <p class="card-state">${esc(typeLabels[p.propertyType]||'Property')}</p>
                <p class="card-name" style="font-size:18px;">${esc(p.address)}</p>
                <span class="card-btn">View &rarr;</span>
              </a>`;
            }).join('')}</div>
          </div>`;
          body.insertAdjacentHTML('beforeend', presHTML);
        });
      }).catch(() => {});
    }

    function toggleAcqPanel(acqId) {
      const panel = document.getElementById('acq-panel-' + acqId);
      if (panel) panel.classList.toggle('open');
    }

    async function init() {
      let me;
      try {
        const res = await fetch('/api/me');
        if (!res.ok) { location.href = '/clients/'; return; }
        me = await res.json();
      } catch { location.href = '/clients/'; return; }

      // Check for multiple acquisitions
      let multiAcqData = null;
      try {
        const acqRes = await fetch('/api/client/acquisitions');
        if (acqRes.ok) {
          const d = await acqRes.json();
          if (d.multiAcquisition && d.acquisitions && d.acquisitions.length > 1) multiAcqData = d;
        }
      } catch {}

      const isCompleted = me.status === 'completed';
      const hasPortfolio = (me.purchaseCount || 0) > 0;

      document.getElementById('user-name').textContent = me.name;
      document.getElementById('welcome-heading').textContent = `Welcome back, ${me.name.split(' ')[0]}.`;

      if (isCompleted) {
        // Portfolio mode: hide active journey elements
        document.getElementById('q-section').style.display = 'none';
        document.getElementById('brief-section').style.display = 'none';
        document.getElementById('reports-section').style.display = 'none';
        document.getElementById('journey-section').style.display = 'none';
        document.getElementById('settlement-section').style.display = 'none';
        document.getElementById('presentations-section').style.display = 'none';
      } else {
        // Active journey mode
        if (multiAcqData) {
          renderMultiAcquisition(multiAcqData.acquisitions, me);
          // Show portfolio if applicable
          if (hasPortfolio) {
            try {
              const pr = await fetch('/api/client/properties');
              if (pr.ok) { renderPortfolio(await pr.json()); }
            } catch {}
          }
          return;
        }
        renderSettlement(me.settlementDate);
        renderJourney(me.pipelineStage, me.settlementDate);

        let qCompleted = false, briefPublished = false, presentations = [];
        try {
          const [qr, br, pr] = await Promise.all([
            fetch('/api/submit-questionnaire'),
            fetch('/api/brief'),
            fetch('/api/presentations'),
          ]);
          if (qr.ok) { const qd = await qr.json(); qCompleted = qd.completed === true; }
          if (br.ok) { const bd = await br.json(); briefPublished = bd.published === true; }
          if (pr.ok) { const pd = await pr.json(); presentations = pd.presentations || []; }
        } catch (e) { console.error('[portal] fetch error', e); }

        renderQSection(qCompleted);
        renderStatusBanner(me.pipelineStage, qCompleted);
        renderBriefSection(qCompleted, briefPublished);
        renderPresentations(presentations);
        renderReports(me.markets);
      }

      // Show portfolio for completed clients and re-engaged clients with past purchases
      if (hasPortfolio) {
        try {
          const pr = await fetch('/api/client/properties');
          if (pr.ok) { renderPortfolio(await pr.json()); }
        } catch { /* non-critical */ }
      }
    }

    document.getElementById('logout-btn').addEventListener('click', async function() {
      await fetch('/api/logout', { method: 'POST' });
      location.href = '/clients/';
    });

    init();
  </script>
<script>
(function(){
  var tok=(document.cookie.split(';').find(function(s){return s.trim().startsWith('fw_session=');})||'').replace(/^\s*fw_session=/,'');
  if(!tok)return;
  var p;try{p=JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));}catch(e){return;}
  if(!p||!p.preview)return;
  var bar=document.createElement('div');
  bar.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#bd7a70;color:#22201d;font-family:Outfit,sans-serif;font-size:13px;font-weight:500;padding:11px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.2);';
  bar.innerHTML='<span style="flex:1;">Previewing portal as <strong>'+(p.name||'client')+'</strong> — do not submit any forms.</span>'
    +'<button onclick="document.cookie=\'fw_session=;expires=Thu,01 Jan 1970 00:00:00 GMT;path=/\';location.href=\'/admin/\';" style="background:rgba(0,0,0,0.18);color:#22201d;border:none;border-radius:6px;padding:6px 14px;font-family:Outfit,sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">Exit preview</button>';
  document.body.prepend(bar);
  document.body.style.paddingTop='44px';
})();
</script>
