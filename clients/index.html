<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Login — Fairway Investing</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="theme-color" content="#22201d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;}
    body{font-family:'Outfit',sans-serif;font-weight:300;background:#1a1916;color:#f7f3ed;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
    a{color:inherit;text-decoration:none;}
    .card{width:100%;max-width:420px;background:#22201d;border:1px solid rgba(247,243,237,0.09);border-radius:20px;padding:44px 40px;}
    .logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:36px;}
    .eyebrow{font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#bd7a70;margin-bottom:10px;}
    h1{font-family:'Fraunces',serif;font-size:28px;font-weight:400;line-height:1.2;letter-spacing:-0.3px;margin-bottom:6px;}
    .sub{font-size:14px;font-weight:300;color:rgba(247,243,237,0.4);margin-bottom:32px;line-height:1.6;}
    label{display:block;font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:rgba(247,243,237,0.4);margin-bottom:7px;}
    input{width:100%;background:rgba(247,243,237,0.05);border:1px solid rgba(247,243,237,0.12);border-radius:10px;padding:13px 16px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:300;color:#f7f3ed;outline:none;transition:border-color .2s;}
    input::placeholder{color:rgba(247,243,237,0.2);}
    input:focus{border-color:rgba(189,122,112,0.6);}
    .field{margin-bottom:18px;position:relative;}
    .pw-wrap{position:relative;}
    .pw-wrap input{padding-right:46px;}
    .eye-btn{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;padding:4px;cursor:pointer;color:rgba(247,243,237,0.3);display:flex;align-items:center;transition:color .15s;}
    .eye-btn:hover{color:rgba(247,243,237,0.7);}
    .forgot{display:block;margin-top:8px;font-size:12.5px;color:rgba(247,243,237,0.35);text-align:right;cursor:pointer;transition:color .15s;background:none;border:none;font-family:'Outfit',sans-serif;padding:0;}
    .forgot:hover{color:#bd7a70;}
    .reset-form{display:none;}
    .reset-form.visible{display:block;}
    .btn{width:100%;margin-top:8px;padding:15px;background:#bd7a70;border:none;border-radius:10px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;color:#f7f3ed;cursor:pointer;transition:background .2s,opacity .2s;letter-spacing:0.02em;}
    .btn:hover{background:#cf9b92;}
    .btn:disabled{opacity:0.5;cursor:not-allowed;}
    .error{margin-top:16px;padding:12px 16px;background:rgba(189,122,112,0.12);border:1px solid rgba(189,122,112,0.3);border-radius:10px;font-size:13.5px;font-weight:300;color:#cf9b92;display:none;}
    .error.visible{display:block;}
    .success{margin-top:16px;padding:12px 16px;background:rgba(109,191,123,0.1);border:1px solid rgba(109,191,123,0.25);border-radius:10px;font-size:13.5px;font-weight:300;color:#6dbf7b;display:none;}
    .success.visible{display:block;}
    .back{margin-top:24px;text-align:center;font-size:13px;font-weight:300;color:rgba(247,243,237,0.3);}
    .back a{color:rgba(247,243,237,0.4);transition:color .2s;}
    .back a:hover{color:rgba(247,243,237,0.7);}
    @media(max-width:480px){.card{padding:32px 24px;}h1{font-size:24px;}}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="/logo-icon.png" alt="" style="height:28px;width:auto;">
      <img src="/logo-word.png" alt="Fairway Investing" style="height:18px;width:auto;">
    </div>
    <p class="eyebrow">Client access</p>
    <h1>Sign in to your portal</h1>
    <p class="sub">Enter your credentials below to access your research reports.</p>
    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="eye-btn" id="eye-login" aria-label="Show password" tabindex="-1">
            <svg id="eye-icon-login" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <button type="button" class="forgot" id="forgot-btn">Forgot password?</button>
      </div>
      <button class="btn" type="submit" id="btn">Sign in</button>
      <div class="error" id="error"></div>
    </form>

    <div class="reset-form" id="reset-form">
      <div class="field">
        <label for="reset-email">Your email address</label>
        <input type="email" id="reset-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <button class="btn" type="button" id="reset-btn">Send reset link</button>
      <div class="error" id="reset-error"></div>
      <div class="success" id="reset-success"></div>
      <p class="back" style="margin-top:16px;"><button type="button" style="background:none;border:none;font-family:'Outfit',sans-serif;font-size:13px;color:rgba(247,243,237,0.4);cursor:pointer;" id="back-to-login">&larr; Back to sign in</button></p>
    </div>

    <p class="back" id="back-link"><a href="/">&larr; Back to fairwayinvesting.com.au</a></p>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const raw = params.get('redirect') || '';
      const redirect = raw.startsWith('/') && !raw.startsWith('//') ? raw : '/clients/portal.html';

      fetch('/api/me').then(r => { if (r.ok) location.href = redirect; }).catch(() => {});

      // Eye toggle — login password
      const pwInput = document.getElementById('password');
      document.getElementById('eye-login').addEventListener('click', function() {
        const show = pwInput.type === 'password';
        pwInput.type = show ? 'text' : 'password';
        document.getElementById('eye-icon-login').innerHTML = show
          ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      });

      // Sign in form
      document.getElementById('form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btn');
        const errEl = document.getElementById('error');
        btn.disabled = true;
        btn.textContent = 'Signing in…';
        errEl.classList.remove('visible');
        const email = document.getElementById('email').value.trim();
        const password = pwInput.value;
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();
          if (res.ok) {
            location.href = redirect;
          } else {
            errEl.textContent = data.error || 'Sign in failed. Please try again.';
            errEl.classList.add('visible');
            btn.disabled = false;
            btn.textContent = 'Sign in';
          }
        } catch {
          errEl.textContent = 'Connection error. Please try again.';
          errEl.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      });

      // Forgot password toggle
      function showReset() {
        document.getElementById('form').style.display = 'none';
        document.getElementById('reset-form').classList.add('visible');
        document.getElementById('reset-email').value = document.getElementById('email').value;
        document.getElementById('reset-email').focus();
      }
      function showLogin() {
        document.getElementById('form').style.display = '';
        document.getElementById('reset-form').classList.remove('visible');
        document.getElementById('reset-error').classList.remove('visible');
        document.getElementById('reset-success').classList.remove('visible');
      }
      document.getElementById('forgot-btn').addEventListener('click', showReset);
      document.getElementById('back-to-login').addEventListener('click', showLogin);

      // Reset password request
      document.getElementById('reset-btn').addEventListener('click', async function() {
        const btn = this;
        const errEl = document.getElementById('reset-error');
        const successEl = document.getElementById('reset-success');
        const email = document.getElementById('reset-email').value.trim();
        errEl.classList.remove('visible');
        successEl.classList.remove('visible');
        if (!email) { errEl.textContent = 'Please enter your email address.'; errEl.classList.add('visible'); return; }
        btn.disabled = true;
        btn.textContent = 'Sending…';
        try {
          await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          });
          successEl.textContent = 'If that email is registered, a reset link is on its way. Check your inbox.';
          successEl.classList.add('visible');
          btn.textContent = 'Link sent';
        } catch {
          errEl.textContent = 'Connection error. Please try again.';
          errEl.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Send reset link';
        }
      });
    })();
  </script>
</body>
</html>
