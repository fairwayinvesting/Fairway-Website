<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password — Fairway Investing</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="theme-color" content="#22201d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;}
    body{font-family:'Outfit',sans-serif;font-weight:300;background:#1a1916;color:#f7f3ed;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
    a{color:inherit;text-decoration:none;}
    .card{width:100%;max-width:420px;background:#22201d;border:1px solid rgba(247,243,237,0.09);border-radius:20px;padding:44px 40px;}
    .logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:36px;}
    .eyebrow{font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#bd7a70;margin-bottom:10px;}
    h1{font-family:'Fraunces',serif;font-size:28px;font-weight:400;line-height:1.2;letter-spacing:-0.3px;margin-bottom:6px;}
    .sub{font-size:14px;font-weight:300;color:rgba(247,243,237,0.4);margin-bottom:32px;line-height:1.6;}
    label{display:block;font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:rgba(247,243,237,0.4);margin-bottom:7px;}
    input{width:100%;background:rgba(247,243,237,0.05);border:1px solid rgba(247,243,237,0.12);border-radius:10px;padding:13px 16px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:300;color:#f7f3ed;outline:none;transition:border-color .2s;}
    input::placeholder{color:rgba(247,243,237,0.2);}
    input:focus{border-color:rgba(189,122,112,0.6);}
    .field{margin-bottom:18px;}
    .pw-wrap{position:relative;}
    .pw-wrap input{padding-right:46px;}
    .eye-btn{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;padding:4px;cursor:pointer;color:rgba(247,243,237,0.3);display:flex;align-items:center;transition:color .15s;}
    .eye-btn:hover{color:rgba(247,243,237,0.7);}
    .btn{width:100%;margin-top:8px;padding:15px;background:#bd7a70;border:none;border-radius:10px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;color:#f7f3ed;cursor:pointer;transition:background .2s,opacity .2s;letter-spacing:0.02em;}
    .btn:hover{background:#cf9b92;}
    .btn:disabled{opacity:0.5;cursor:not-allowed;}
    .error{margin-top:16px;padding:12px 16px;background:rgba(189,122,112,0.12);border:1px solid rgba(189,122,112,0.3);border-radius:10px;font-size:13.5px;font-weight:300;color:#cf9b92;display:none;}
    .error.visible{display:block;}
    .success{margin-top:16px;padding:12px 16px;background:rgba(100,180,100,0.1);border:1px solid rgba(100,180,100,0.3);border-radius:10px;font-size:13.5px;font-weight:300;color:#8ec98e;display:none;}
    .success.visible{display:block;}
    .back{margin-top:24px;text-align:center;font-size:13px;font-weight:300;color:rgba(247,243,237,0.3);}
    .back a{color:rgba(247,243,237,0.4);transition:color .2s;}
    .back a:hover{color:rgba(247,243,237,0.7);}
    @media(max-width:480px){.card{padding:32px 24px;}h1{font-size:24px;}}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="/logo-icon.png" alt="" style="height:28px;width:auto;">
      <img src="/logo-word.png" alt="Fairway Investing" style="height:18px;width:auto;">
    </div>
    <p class="eyebrow">Client portal</p>
    <h1>Set your password</h1>
    <p class="sub">Choose a password to secure your Fairway portal access.</p>
    <form id="form" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required>
          <button type="button" class="eye-btn" id="eye-pw" aria-label="Show password" tabindex="-1">
            <svg id="eye-icon-pw" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <div class="pw-wrap">
          <input type="password" id="confirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password" required>
          <button type="button" class="eye-btn" id="eye-confirm" aria-label="Show confirm password" tabindex="-1">
            <svg id="eye-icon-confirm" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn" type="submit" id="btn">Set password &amp; continue</button>
      <div class="error" id="error"></div>
      <div class="success" id="success"></div>
    </form>
    <p class="back"><a href="/">&larr; Back to fairwayinvesting.com.au</a></p>
  </div>

  <script>
    (function() {
      // Eye toggles
      function makeEyeToggle(inputId, btnId, iconId) {
        document.getElementById(btnId).addEventListener('click', function() {
          const inp = document.getElementById(inputId);
          const show = inp.type === 'password';
          inp.type = show ? 'text' : 'password';
          document.getElementById(iconId).innerHTML = show
            ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
            : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        });
      }
      makeEyeToggle('password', 'eye-pw', 'eye-icon-pw');
      makeEyeToggle('confirm', 'eye-confirm', 'eye-icon-confirm');

      const params = new URLSearchParams(location.search);
      const token = params.get('token') || '';

      if (!token) {
        document.getElementById('error').textContent = 'No setup token found. Please use the link from your welcome email.';
        document.getElementById('error').classList.add('visible');
        document.getElementById('btn').disabled = true;
      }

      document.getElementById('form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btn');
        const errEl = document.getElementById('error');
        const successEl = document.getElementById('success');

        errEl.classList.remove('visible');
        successEl.classList.remove('visible');

        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        if (password.length < 8) {
          errEl.textContent = 'Password must be at least 8 characters.';
          errEl.classList.add('visible');
          return;
        }
        if (password !== confirm) {
          errEl.textContent = 'Passwords do not match.';
          errEl.classList.add('visible');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Setting password…';

        try {
          const res = await fetch('/api/setup-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password }),
          });
          const data = await res.json();
          if (res.ok) {
            successEl.textContent = 'Password set! Taking you to your portal…';
            successEl.classList.add('visible');
            setTimeout(() => { location.href = '/clients/portal.html'; }, 1200);
          } else {
            errEl.textContent = data.error || 'Something went wrong. Please try again.';
            errEl.classList.add('visible');
            btn.disabled = false;
            btn.textContent = 'Set password & continue';
          }
        } catch {
          errEl.textContent = 'Connection error. Please try again.';
          errEl.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Set password & continue';
        }
      });
    })();
  </script>
</body>
</html>
