<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set your password — Fairway Staff Portal</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Outfit',sans-serif;font-weight:300;background:#1a1916;color:#f7f3ed;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
    .card{width:100%;max-width:420px;background:#22201d;border:1px solid rgba(247,243,237,0.09);border-radius:20px;padding:44px 40px;}
    .logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:36px;}
    .eyebrow{font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#bd7a70;margin-bottom:10px;}
    h1{font-family:'Fraunces',serif;font-size:28px;font-weight:400;line-height:1.2;margin-bottom:6px;}
    .sub{font-size:14px;color:rgba(247,243,237,0.4);margin-bottom:32px;line-height:1.6;}
    label{display:block;font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:rgba(247,243,237,0.4);margin-bottom:7px;}
    input{width:100%;background:rgba(247,243,237,0.05);border:1px solid rgba(247,243,237,0.12);border-radius:10px;padding:13px 16px;font-family:'Outfit',sans-serif;font-size:15px;color:#f7f3ed;outline:none;transition:border-color .2s;}
    input:focus{border-color:rgba(189,122,112,0.6);}
    .field{margin-bottom:18px;}
    .btn{width:100%;margin-top:8px;padding:15px;background:#bd7a70;border:none;border-radius:10px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;color:#f7f3ed;cursor:pointer;transition:background .2s,opacity .2s;}
    .btn:hover{background:#cf9b92;}
    .btn:disabled{opacity:0.5;cursor:not-allowed;}
    .error{margin-top:16px;padding:12px 16px;background:rgba(189,122,112,0.12);border:1px solid rgba(189,122,112,0.3);border-radius:10px;font-size:13.5px;color:#cf9b92;display:none;}
    .error.visible{display:block;}
    @media(max-width:480px){.card{padding:32px 24px;}}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="/logo-icon.png" alt="" style="height:28px;width:auto;">
      <img src="/logo-word.png" alt="Fairway Investing" style="height:18px;width:auto;">
    </div>
    <p class="eyebrow">Staff portal</p>
    <h1>Set your password</h1>
    <p class="sub">Choose a password for your Fairway staff portal account.</p>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" placeholder="Repeat password" autocomplete="new-password">
    </div>
    <button class="btn" id="btn">Set password &amp; sign in</button>
    <div class="error" id="error"></div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      document.getElementById('error').textContent = 'Invalid or missing setup token. Contact Luke.';
      document.getElementById('error').className = 'error visible';
      document.getElementById('btn').disabled = true;
    }

    document.getElementById('btn').addEventListener('click', async () => {
      const btn = document.getElementById('btn');
      const errEl = document.getElementById('error');
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      errEl.className = 'error';

      if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.className = 'error visible'; return; }
      if (password !== confirm) { errEl.textContent = 'Passwords do not match.'; errEl.className = 'error visible'; return; }

      btn.disabled = true; btn.textContent = 'Setting up…';
      try {
        const r = await fetch('/api/staff/setup-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        if (r.ok) {
          window.location = '/staff/portal.html';
        } else {
          const d = await r.json().catch(() => ({}));
          errEl.textContent = d.error || 'Setup failed. Please try again.';
          errEl.className = 'error visible';
          btn.disabled = false; btn.textContent = 'Set password & sign in';
        }
      } catch {
        errEl.textContent = 'Network error. Please try again.';
        errEl.className = 'error visible';
        btn.disabled = false; btn.textContent = 'Set password & sign in';
      }
    });
  </script>
</body>
</html>
