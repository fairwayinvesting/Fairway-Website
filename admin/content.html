<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content — Fairway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:#181614;color:#f7f3ed;font-family:'Outfit',sans-serif;font-weight:300;min-height:100vh;}
  a{color:inherit;}
  button{font-family:'Outfit',sans-serif;}
  input,select,textarea{font-family:'Outfit',sans-serif;color:#f7f3ed;}
  input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.5);}

  /* Layout */
  .layout{display:flex;min-height:100vh;}
  .sidebar{width:200px;flex-shrink:0;background:#111010;border-right:1px solid rgba(247,243,237,0.07);display:flex;flex-direction:column;padding:20px 0;}
  .sidebar-logo{padding:12px 20px 24px;border-bottom:1px solid rgba(247,243,237,0.07);margin-bottom:12px;}
  .sidebar-logo img{height:22px;}
  .snav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 20px;background:none;border:none;color:rgba(247,243,237,0.42);font-size:13px;font-weight:400;cursor:pointer;transition:all .15s;text-align:left;text-decoration:none;}
  .snav-item:hover{color:#f7f3ed;background:rgba(247,243,237,0.04);}
  .snav-item.active{color:#f7f3ed;background:rgba(247,243,237,0.07);}
  .snav-spacer{flex:1;}
  .snav-back{margin-top:auto;padding:12px 20px 0;border-top:1px solid rgba(247,243,237,0.07);}
  .snav-back a{display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(247,243,237,0.35);text-decoration:none;transition:color .15s;}
  .snav-back a:hover{color:#f7f3ed;}
  .main{flex:1;min-width:0;padding:32px 36px;overflow:auto;}

  /* Header */
  .page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:28px;}
  .page-title{font-family:'Fraunces',serif;font-size:28px;font-weight:400;}
  .header-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .view-tabs{display:flex;gap:2px;background:rgba(247,243,237,0.04);border:1px solid rgba(247,243,237,0.08);border-radius:9px;padding:3px;}
  .view-tab{padding:6px 14px;border-radius:7px;border:none;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;background:transparent;color:rgba(247,243,237,0.38);}
  .view-tab.active{background:rgba(247,243,237,0.08);color:#f7f3ed;}
  .type-tabs{display:flex;gap:3px;}
  .type-tab{padding:6px 14px;border-radius:100px;border:1px solid rgba(247,243,237,0.1);font-size:12px;font-weight:500;cursor:pointer;background:transparent;color:rgba(247,243,237,0.38);transition:all .15s;}
  .type-tab.active{background:rgba(189,122,112,0.12);border-color:rgba(189,122,112,0.35);color:#bd7a70;}
  .btn-primary{background:#bd7a70;color:#fff;border:none;border-radius:100px;padding:9px 20px;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
  .btn-primary:hover{opacity:.88;}
  .btn-secondary{background:none;border:1px solid rgba(247,243,237,0.15);border-radius:100px;color:rgba(247,243,237,0.55);font-size:12.5px;padding:7px 14px;cursor:pointer;transition:all .15s;}
  .btn-secondary:hover{border-color:rgba(247,243,237,0.3);color:#f7f3ed;}

  /* Kanban */
  .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:20px;align-items:flex-start;}
  .kanban-col{flex-shrink:0;width:230px;background:rgba(247,243,237,0.03);border:1px solid rgba(247,243,237,0.07);border-radius:14px;padding:14px;}
  .kanban-col.drag-over{border-color:rgba(189,122,112,0.45);background:rgba(189,122,112,0.04);}
  .kanban-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .kanban-col-label{font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(247,243,237,0.35);}
  .kanban-col-count{font-size:11px;color:rgba(247,243,237,0.2);background:rgba(247,243,237,0.06);border-radius:100px;padding:1px 7px;}
  .kanban-card{background:#22201d;border:1px solid rgba(247,243,237,0.09);border-radius:10px;padding:12px;margin-bottom:8px;cursor:grab;transition:border-color .15s,box-shadow .15s;user-select:none;}
  .kanban-card:hover{border-color:rgba(247,243,237,0.2);box-shadow:0 4px 16px rgba(0,0,0,.3);}
  .kanban-card.dragging{opacity:.5;cursor:grabbing;}
  .kanban-card-title{font-size:13.5px;color:#f7f3ed;font-weight:400;line-height:1.4;margin-bottom:6px;}
  .kanban-card-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
  .kc-badge{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;border-radius:100px;padding:2px 7px;}
  .kc-long{background:rgba(189,122,112,0.12);color:#bd7a70;border:1px solid rgba(189,122,112,0.2);}
  .kc-short{background:rgba(109,191,123,0.1);color:#6dbf7b;border:1px solid rgba(109,191,123,0.2);}
  .kc-date{font-size:11px;color:rgba(247,243,237,0.3);}
  .kc-guest{font-size:11px;color:rgba(247,243,237,0.35);margin-top:4px;display:block;}

  /* Calendar */
  .cal-wrap{display:none;}
  .cal-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .cal-month-label{font-family:'Fraunces',serif;font-size:20px;font-weight:400;min-width:180px;}
  .cal-nav{background:none;border:1px solid rgba(247,243,237,0.1);border-radius:100px;color:rgba(247,243,237,0.5);width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .cal-nav:hover{border-color:rgba(247,243,237,0.3);color:#f7f3ed;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:rgba(247,243,237,0.07);border-radius:12px;overflow:hidden;}
  .cal-dow{background:#181614;padding:8px 0;text-align:center;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(247,243,237,0.25);}
  .cal-cell{background:#1a1816;min-height:110px;padding:8px;position:relative;vertical-align:top;transition:background .15s;}
  .cal-cell.other-month{opacity:.4;}
  .cal-cell.today{background:#1e1b18;}
  .cal-cell.drag-over{background:rgba(189,122,112,0.08);}
  .cal-day-num{font-size:11.5px;color:rgba(247,243,237,0.3);margin-bottom:4px;}
  .cal-cell.today .cal-day-num{color:#bd7a70;font-weight:600;}
  .cal-event{font-size:11px;padding:3px 6px;border-radius:5px;margin-bottom:3px;cursor:pointer;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .15s;}
  .cal-event:hover{opacity:.8;}
  .cal-event.long-form{background:rgba(189,122,112,0.2);color:#e8a090;border-left:2px solid #bd7a70;}
  .cal-event.short-form{background:rgba(109,191,123,0.15);color:#7dd48a;border-left:2px solid #6dbf7b;}
  .cal-event.dragging{opacity:.4;}

  /* Detail panel */
  .panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:400;display:none;opacity:0;transition:opacity .2s;}
  .panel-overlay.open{display:block;opacity:1;}
  .detail-panel{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;background:#1a1816;border-left:1px solid rgba(247,243,237,0.1);z-index:401;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:28px;}
  .detail-panel.open{transform:translateX(0);}
  .panel-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px;}
  .panel-close{background:none;border:none;color:rgba(247,243,237,0.4);font-size:22px;cursor:pointer;line-height:1;flex-shrink:0;margin-top:2px;}
  .panel-close:hover{color:#f7f3ed;}
  .panel-title{font-family:'Fraunces',serif;font-size:22px;font-weight:400;line-height:1.3;flex:1;}
  .panel-section{margin-bottom:20px;}
  .panel-label{font-size:10.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(247,243,237,0.3);margin-bottom:6px;}
  .panel-input{width:100%;background:rgba(247,243,237,0.04);border:1px solid rgba(247,243,237,0.1);border-radius:9px;padding:10px 13px;font-size:13.5px;color:#f7f3ed;outline:none;transition:border-color .15s;}
  .panel-input:focus{border-color:rgba(189,122,112,0.5);}
  .panel-textarea{width:100%;background:rgba(247,243,237,0.04);border:1px solid rgba(247,243,237,0.1);border-radius:9px;padding:10px 13px;font-size:13.5px;color:#f7f3ed;outline:none;resize:vertical;transition:border-color .15s;}
  .panel-textarea:focus{border-color:rgba(189,122,112,0.5);}
  .stage-sel{display:flex;flex-wrap:wrap;gap:5px;}
  .stage-btn{padding:5px 11px;border-radius:100px;border:1px solid rgba(247,243,237,0.1);font-size:11.5px;cursor:pointer;background:transparent;color:rgba(247,243,237,0.38);transition:all .15s;white-space:nowrap;}
  .stage-btn.active{background:rgba(189,122,112,0.15);border-color:rgba(189,122,112,0.4);color:#bd7a70;font-weight:500;}
  .guest-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(247,243,237,0.06);border:1px solid rgba(247,243,237,0.1);border-radius:100px;padding:4px 10px;font-size:12px;color:rgba(247,243,237,0.7);margin:2px;}
  .guest-chip button{background:none;border:none;color:rgba(247,243,237,0.3);cursor:pointer;font-size:14px;line-height:1;padding:0;}
  .platform-cb{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(247,243,237,0.6);cursor:pointer;margin:3px 0;}
  .platform-cb input{accent-color:#bd7a70;}
  .guest-search{position:relative;}
  .guest-dropdown{position:absolute;top:100%;left:0;right:0;background:#22201d;border:1px solid rgba(247,243,237,0.12);border-radius:9px;z-index:10;max-height:180px;overflow-y:auto;margin-top:4px;display:none;}
  .guest-option{padding:9px 13px;cursor:pointer;font-size:13px;color:rgba(247,243,237,0.7);transition:background .1s;}
  .guest-option:hover{background:rgba(247,243,237,0.05);}
  .warning-banner{background:rgba(232,168,124,0.1);border:1px solid rgba(232,168,124,0.25);border-radius:8px;padding:8px 12px;font-size:12.5px;color:#e8a87c;margin-top:6px;display:none;}
  .panel-actions{display:flex;gap:8px;margin-top:24px;padding-top:20px;border-top:1px solid rgba(247,243,237,0.07);}

  /* Create modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;display:none;align-items:center;justify-content:center;padding:24px;}
  .modal{background:#1e1b18;border:1px solid rgba(247,243,237,0.1);border-radius:18px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
  .modal h2{font-family:'Fraunces',serif;font-size:22px;font-weight:400;margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(247,243,237,0.35);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;background:rgba(247,243,237,0.04);border:1px solid rgba(247,243,237,0.11);border-radius:10px;padding:11px 13px;font-size:13.5px;color:#f7f3ed;outline:none;transition:border-color .15s;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(189,122,112,0.45);}
  .field select option{background:#22201d;}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid rgba(247,243,237,0.07);}
  .error-msg{font-size:12.5px;color:#e07070;margin-bottom:10px;display:none;}
  .error-msg.visible{display:block;}

  /* Toast */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#22201d;border:1px solid rgba(247,243,237,0.12);border-radius:100px;padding:10px 20px;font-size:13.5px;color:#f7f3ed;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}

  /* Empty */
  .empty-state{text-align:center;padding:60px 0;color:rgba(247,243,237,0.2);font-size:14px;}

  /* Video section in panel */
  .video-section{background:rgba(247,243,237,0.02);border:1px solid rgba(247,243,237,0.08);border-radius:10px;padding:14px;margin-bottom:20px;}
  .video-filename{font-size:13px;color:rgba(247,243,237,0.55);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .video-filename svg{opacity:.4;}
  .video-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .btn-video{padding:7px 14px;border-radius:100px;border:1px solid rgba(247,243,237,0.12);font-size:12px;font-weight:500;cursor:pointer;background:transparent;color:rgba(247,243,237,0.55);transition:all .15s;}
  .btn-video:hover{border-color:rgba(247,243,237,0.3);color:#f7f3ed;}
  .btn-video:disabled{opacity:.35;cursor:not-allowed;}
  .upload-prog-wrap{width:100%;height:3px;background:rgba(247,243,237,0.07);border-radius:100px;overflow:hidden;margin-top:10px;display:none;}
  .upload-prog-bar{height:100%;background:#bd7a70;border-radius:100px;width:0%;transition:width .3s;}

  /* Ideas modal */
  .ideas-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .idea-card{background:rgba(247,243,237,0.03);border:1px solid rgba(247,243,237,0.08);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .15s;}
  .idea-card:hover{border-color:rgba(189,122,112,0.35);}
  .idea-title{font-size:14px;color:#f7f3ed;font-weight:400;margin-bottom:4px;}
  .idea-hook{font-size:12.5px;color:rgba(247,243,237,0.4);line-height:1.5;}
  .idea-type{font-size:10.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(189,122,112,0.7);margin-bottom:6px;}
  .ideas-loading{text-align:center;padding:32px;color:rgba(247,243,237,0.3);font-size:13.5px;}

  /* Scrollbar */
  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(247,243,237,0.1);border-radius:10px;}

  /* Partner series planner */
  .partners-search{width:100%;max-width:300px;background:rgba(247,243,237,0.04);border:1px solid rgba(247,243,237,0.1);border-radius:9px;padding:9px 14px;font-size:13px;color:#f7f3ed;outline:none;transition:border-color .15s;}
  .partners-search:focus{border-color:rgba(189,122,112,0.4);}
  .partners-search::placeholder{color:rgba(247,243,237,0.22);}
  .partners-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px;}
  .partner-card{background:rgba(247,243,237,0.03);border:1px solid rgba(247,243,237,0.08);border-radius:14px;padding:18px 20px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .partner-card:hover{border-color:rgba(189,122,112,0.35);box-shadow:0 4px 16px rgba(0,0,0,.25);}
  .partner-card-name{font-size:14.5px;color:#f7f3ed;font-weight:400;margin-bottom:2px;}
  .partner-card-role{font-size:11.5px;color:rgba(247,243,237,0.32);margin-bottom:14px;}
  .ep-track{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;min-height:26px;align-items:center;}
  .ep-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;flex-shrink:0;}
  .ep-dot-planned{background:rgba(247,243,237,0.05);border:1px solid rgba(247,243,237,0.12);color:rgba(247,243,237,0.3);}
  .ep-dot-outreach_sent{background:rgba(232,168,124,0.12);border:1px solid rgba(232,168,124,0.3);color:#e8a87c;}
  .ep-dot-confirmed{background:rgba(189,122,112,0.15);border:1px solid rgba(189,122,112,0.4);color:#bd7a70;}
  .ep-dot-recorded{background:rgba(109,191,123,0.12);border:1px solid rgba(109,191,123,0.3);color:#6dbf7b;}
  .ep-dot-published{background:rgba(109,191,123,0.22);border:1px solid #6dbf7b;color:#6dbf7b;}
  .partner-card-stats{font-size:11.5px;color:rgba(247,243,237,0.28);}
  .partner-panel-ep{background:rgba(247,243,237,0.02);border:1px solid rgba(247,243,237,0.07);border-radius:11px;padding:14px 16px;margin-bottom:10px;}
  .ep-status-pill{font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;border-radius:100px;padding:2px 8px;}
  .ep-status-pill.ep-s-planned{background:rgba(247,243,237,0.06);color:rgba(247,243,237,0.38);}
  .ep-status-pill.ep-s-outreach_sent{background:rgba(232,168,124,0.12);color:#e8a87c;}
  .ep-status-pill.ep-s-confirmed{background:rgba(189,122,112,0.15);color:#bd7a70;}
  .ep-status-pill.ep-s-recorded{background:rgba(109,191,123,0.12);color:#6dbf7b;}
  .ep-status-pill.ep-s-published{background:rgba(109,191,123,0.22);color:#6dbf7b;}
  .ep-status-sel{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px;}
  .ep-status-btn{padding:4px 10px;border-radius:100px;border:1px solid rgba(247,243,237,0.1);font-size:11px;cursor:pointer;background:transparent;color:rgba(247,243,237,0.35);transition:all .15s;white-space:nowrap;}
  .ep-status-btn:hover{border-color:rgba(247,243,237,0.25);color:#f7f3ed;}
  .ep-status-btn.sa-planned{background:rgba(247,243,237,0.07);border-color:rgba(247,243,237,0.2);color:#f7f3ed;}
  .ep-status-btn.sa-outreach_sent{background:rgba(232,168,124,0.12);border-color:rgba(232,168,124,0.4);color:#e8a87c;}
  .ep-status-btn.sa-confirmed{background:rgba(189,122,112,0.14);border-color:rgba(189,122,112,0.4);color:#bd7a70;}
  .ep-status-btn.sa-recorded{background:rgba(109,191,123,0.12);border-color:rgba(109,191,123,0.35);color:#6dbf7b;}
  .ep-status-btn.sa-published{background:rgba(109,191,123,0.2);border-color:#6dbf7b;color:#6dbf7b;}

  /* Weekly target bar */
  .weekly-bar{background:rgba(247,243,237,0.03);border:1px solid rgba(247,243,237,0.07);border-radius:12px;padding:13px 18px;margin-bottom:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .weekly-bar-msg{font-size:13.5px;flex-shrink:0;}
  .weekly-bar-sub{font-size:10.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(247,243,237,0.25);margin-bottom:3px;}
  .weekly-bar-track{flex:1;min-width:160px;}
  .weekly-bar-prog{height:4px;background:rgba(247,243,237,0.07);border-radius:100px;overflow:hidden;margin-bottom:4px;}
  .weekly-bar-fill{height:100%;border-radius:100px;transition:width .4s,background .4s;}
  .weekly-bar-meta{display:flex;justify-content:space-between;font-size:10.5px;color:rgba(247,243,237,0.25);}

  /* Panel tabs + episode prep */
  .ptabs{display:flex;gap:2px;background:rgba(247,243,237,0.04);border:1px solid rgba(247,243,237,0.08);border-radius:9px;padding:3px;margin-bottom:20px;}
  .ptab{padding:6px 14px;border-radius:7px;border:none;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;background:transparent;color:rgba(247,243,237,0.38);}
  .ptab.active{background:rgba(247,243,237,0.08);color:#f7f3ed;}
  .prep-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .prep-row{display:flex;align-items:flex-start;gap:8px;}
  .prep-num{font-size:10px;font-weight:700;color:rgba(247,243,237,0.22);min-width:16px;padding-top:10px;flex-shrink:0;}
  .prep-inp{flex:1;background:rgba(247,243,237,0.04);border:1px solid rgba(247,243,237,0.1);border-radius:8px;padding:8px 11px;font-size:13px;color:#f7f3ed;outline:none;resize:none;min-height:36px;transition:border-color .15s;font-family:'Outfit',sans-serif;}
  .prep-inp:focus{border-color:rgba(189,122,112,0.35);}
  .prep-rm{background:none;border:none;color:rgba(247,243,237,0.18);cursor:pointer;font-size:16px;padding:0 0 0 2px;margin-top:8px;flex-shrink:0;line-height:1;}
  .prep-rm:hover{color:rgba(247,243,237,0.45);}

  .prep-add:hover{border-color:rgba(247,243,237,0.2);color:#f7f3ed;}
</style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="/logo-word.png" alt="Fairway" onerror="this.style.display='none'">

      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6.5" height="6.5" rx="1.5" fill="currentColor" opacity=".8"/><rect x="8.5" y="1" width="6.5" height="6.5" rx="1.5" fill="currentColor" opacity=".8"/><rect x="1" y="8.5" width="6.5" height="6.5" rx="1.5" fill="currentColor" opacity=".8"/><rect x="8.5" y="8.5" width="6.5" height="6.5" rx="1.5" fill="currentColor" opacity=".8"/></svg>
      Dashboard
    </a>
    <a class="snav-item active" href="/admin/content.html">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2" fill="currentColor" opacity=".7"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      Content
    </a>
    <div class="snav-spacer"></div>
    <div class="snav-back">
      <a href="/admin/">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M8 2L4 6.5 8 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

  </aside>

  <!-- Main -->
  <main class="main">
    <div class="page-header">
      <h1 class="page-title">Content</h1>
      <div class="header-controls">
        <div class="type-tabs">
          <button class="type-tab active" onclick="setTypeFilter('all',this)">All</button>
          <button class="type-tab" onclick="setTypeFilter('long_form',this)">Long-form</button>
          <button class="type-tab" onclick="setTypeFilter('short_form',this)">Short-form</button>
        </div>
        <div class="view-tabs">
          <button class="view-tab active" onclick="setView('kanban',this)">Kanban</button>
          <button class="view-tab" onclick="setView('calendar',this)">Calendar</button>
          <button class="view-tab" onclick="setView('partners',this)">Partners</button>
        </div>
        <button class="btn-secondary" onclick="openIdeasModal()">💡 Ideas</button>
        <button class="btn-primary" onclick="openCreateModal()">+ Create</button>
      </div>
    </div>

    <!-- Kanban -->

    <!-- Weekly recording target -->

    <!-- Partners planner -->
    <div id="partners-wrap" style="display:none;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
        <input class="partners-search" id="partners-search-input" placeholder="Search partners…" oninput="filterPartners(this.value)">
        <div id="partners-summary" style="font-size:12.5px;color:rgba(247,243,237,0.28);"></div>
      </div>
      <div id="partners-grid" class="partners-grid"></div>
    </div>

    <!-- Calendar -->
    <div class="cal-wrap" id="cal-wrap">
      <div class="cal-header">
        <button class="cal-nav" onclick="calNav(-1)">&#8249;</button>
        <span class="cal-month-label" id="cal-month-label"></span>
        <button class="cal-nav" onclick="calNav(1)">&#8250;</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </main>
</div>

<!-- Detail panel -->
<div class="panel-overlay" id="panel-overlay" onclick="closePanel()"></div>
<div class="detail-panel" id="detail-panel">
  <div class="panel-header">
    <div class="panel-title" id="panel-title">—</div>

  </div>
  <div id="panel-body"></div>
</div>

<!-- Create modal -->
<div class="modal-overlay" id="create-overlay" onclick="if(event.target===this)closeCreateModal()">
  <div class="modal">
    <h2>New content item</h2>
    <div class="field">
      <label>Type</label>
      <select id="cm-type" onchange="updateCreateStages()">
        <option value="long_form">Long-form episode</option>
        <option value="short_form">Short-form piece</option>
      </select>
    </div>
    <div class="field">
      <label>Title</label>
      <input type="text" id="cm-title" placeholder="Episode title or topic…">
    </div>
    <div class="field">
      <label>Stage</label>
      <select id="cm-stage"></select>
    </div>
    <div class="field">
      <label>Scheduled date</label>
      <input type="date" id="cm-date">
    </div>
    <div class="field" id="cm-guest-field">
      <label>Guest (long-form)</label>
      <div class="guest-search">
        <input type="text" id="cm-guest-search" placeholder="Search directory…" oninput="searchGuests(this.value,'cm')" autocomplete="off">
        <div class="guest-dropdown" id="cm-guest-dropdown"></div>
      </div>
      <div id="cm-guest-chips" style="margin-top:6px;"></div>
    </div>
    <div class="field">
      <label>Platforms</label>
      <div id="cm-platforms" style="display:flex;flex-wrap:wrap;gap:8px;">
        <label class="platform-cb"><input type="checkbox" value="youtube"> YouTube</label>
        <label class="platform-cb"><input type="checkbox" value="instagram"> Instagram</label>
        <label class="platform-cb"><input type="checkbox" value="linkedin"> LinkedIn</label>
        <label class="platform-cb"><input type="checkbox" value="tiktok"> TikTok</label>
        <label class="platform-cb"><input type="checkbox" value="facebook"> Facebook</label>
        <label class="platform-cb"><input type="checkbox" value="podcast"> Podcast</label>
      </div>
    </div>
    <div class="error-msg" id="cm-error"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeCreateModal()">Cancel</button>

    </div>

</div>

<!-- Ideas modal -->
<div class="modal-overlay" id="ideas-overlay" onclick="if(event.target===this)closeIdeasModal()">
  <div class="modal" style="max-width:560px;">
    <h2>Content ideas</h2>
    <div class="field">
      <label>Topic or theme (optional)</label>
      <input type="text" id="ideas-topic" placeholder="e.g. first home buyers, depreciation, interest rates…">
    </div>
    <div class="field">
      <label>Guest name (optional)</label>
      <input type="text" id="ideas-guest" placeholder="e.g. Jane Smith — mortgage broker">
    </div>
    <div class="field">
      <label>Content type</label>
      <select id="ideas-type">
        <option value="both">Both long-form and short-form</option>
        <option value="long_form">Long-form episodes only</option>
        <option value="short_form">Short-form clips only</option>
      </select>
    </div>
    <div class="error-msg" id="ideas-error"></div>
    <div class="modal-footer" style="justify-content:space-between;align-items:center;">
      <button class="btn-secondary" onclick="closeIdeasModal()">Close</button>
      <button class="btn-primary" id="ideas-generate-btn" onclick="generateIdeas()">Generate ideas</button>
    </div>
    <div id="ideas-results"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const LONG_STAGES = [
  {key:'idea',label:'Idea'},{key:'guest_invited',label:'Guest invited'},{key:'confirmed',label:'Confirmed'},
  {key:'pre_production',label:'Pre-production'},{key:'recorded',label:'Recorded'},{key:'editing',label:'Editing'},
  {key:'approved',label:'Approved'},{key:'published',label:'Published'},{key:'repurposed',label:'Repurposed'},
];
const SHORT_STAGES = [
  {key:'idea',label:'Idea'},{key:'scripted',label:'Scripted'},{key:'filmed',label:'Filmed'},
  {key:'edited',label:'Edited'},{key:'scheduled',label:'Scheduled'},{key:'published',label:'Published'},
];

let allContent = [];
let allPartners = [];
let _view = 'kanban';
let _typeFilter = 'all';
let _calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let _panelId = null;
let _panelTab = 'details';
let _cmGuests = [];
let _panelGuests = [];
let _dragId = null;

// ── Auth + init ───────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { window.location.href = '/admin/'; }
  return res;
}

(async function init() {
  const verify = await fetch('/api/admin/verify', { method: 'POST' });
  if (!verify.ok) { window.location.href = '/admin/'; return; }
  const [contentRes, partnersRes] = await Promise.all([
    api('GET', '/api/admin/content'),
    api('GET', '/api/admin/referral-partners'),
  ]);
  if (contentRes.ok) allContent = await contentRes.json();
  if (partnersRes.ok) allPartners = await partnersRes.json();
  updateCreateStages();
  render();
})();

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.opacity = '0', 3000);
}

function localDateStr(d) {
  const dt = d || new Date();
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

// ── View / filter ─────────────────────────────────────────────────────────────
function setView(v, btn) {
  _view = v;
  document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b === btn));
  document.getElementById('kanban-wrap').style.display = v === 'kanban' ? '' : 'none';
  document.getElementById('cal-wrap').style.display = v === 'calendar' ? '' : 'none';
  document.getElementById('partners-wrap').style.display = v === 'partners' ? '' : 'none';
  document.getElementById('weekly-target-bar').style.display = v === 'partners' ? 'none' : '';
  const typeTabs = document.querySelector('.type-tabs');
  if (typeTabs) typeTabs.style.display = v === 'partners' ? 'none' : '';
  if (v === 'calendar') renderCalendar();
  if (v === 'partners') renderPartners();
}

function setTypeFilter(t, btn) {
  _typeFilter = t;
  document.querySelectorAll('.type-tab').forEach(b => b.classList.toggle('active', b === btn));
  render();
}

function filteredContent() {
  return allContent.filter(c => !c.deletedAt && (_typeFilter === 'all' || c.type === _typeFilter));
}

function render() {
  renderWeeklyTarget();
  renderKanban();
  if (_view === 'calendar') renderCalendar();
}

// ── Kanban ────────────────────────────────────────────────────────────────────
function stagesForFilter() {
  if (_typeFilter === 'short_form') return SHORT_STAGES;
  if (_typeFilter === 'long_form') return LONG_STAGES;
  // All: merge unique stage keys preserving long_form order
  const seen = new Set();
  return [...LONG_STAGES, ...SHORT_STAGES].filter(s => seen.has(s.key) ? false : seen.add(s.key));
}

function renderKanban() {
  const items = filteredContent();
  const stages = stagesForFilter();
  const wrap = document.getElementById('kanban-wrap');
  if (!wrap) return;

  const byStage = {};
  stages.forEach(s => byStage[s.key] = []);
  items.forEach(c => {
    if (byStage[c.stage] !== undefined) byStage[c.stage].push(c);
    else byStage[stages[0].key].push(c);
  });

  wrap.innerHTML = `<div class="kanban">${stages.map(s => `
    <div class="kanban-col" id="kcol-${s.key}" data-stage="${s.key}"
      ondragover="event.preventDefault();this.classList.add('drag-over')"
      ondragleave="this.classList.remove('drag-over')"
      ondrop="dropOnStage(event,'${s.key}')">
      <div class="kanban-col-head">
        <span class="kanban-col-label">${esc(s.label)}</span>
        <span class="kanban-col-count">${byStage[s.key].length}</span>
      </div>
      ${byStage[s.key].map(c => kanbanCard(c)).join('')}
    </div>`).join('')}
  </div>`;
}

function kanbanCard(c) {
  const guests = c.guestIds.map(gid => allPartners.find(p => p.id === gid)).filter(Boolean);
  const guestNames = guests.map(g => g.name).join(', ');
  const dateLabel = c.scheduledDate ? new Date(c.scheduledDate+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'}) : '';
  return `<div class="kanban-card" id="kcard-${c.id}" draggable="true"
    ondragstart="dragStart(event,'${c.id}')"
    ondragend="dragEnd(event)"
    onclick="openPanel('${c.id}')">
    <div class="kanban-card-title">${esc(c.title)}</div>
    <div class="kanban-card-meta">
      <span class="kc-badge ${c.type==='long_form'?'kc-long':'kc-short'}">${c.type==='long_form'?'Long':'Short'}</span>
      ${dateLabel ? `<span class="kc-date">${dateLabel}</span>` : ''}
    </div>
    ${guestNames ? `<span class="kc-guest">👤 ${esc(guestNames)}</span>` : ''}
  </div>`;
}

// ── Drag & drop (kanban) ───────────────────────────────────────────────────────
function dragStart(e, id) {
  _dragId = id;
  e.dataTransfer.effectAllowed = 'move';
  document.getElementById(`kcard-${id}`)?.classList.add('dragging');
}

function dragEnd(e) {
  if (_dragId) document.getElementById(`kcard-${_dragId}`)?.classList.remove('dragging');
}

async function dropOnStage(e, stage) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!_dragId) return;
  const item = allContent.find(c => c.id === _dragId);
  _dragId = null;
  if (!item || item.stage === stage) return;
  const res = await api('PUT', '/api/admin/content', { id: item.id, stage });
  if (!res.ok) { showToast('Failed to move — please try again.'); return; }
  const updated = await res.json();
  const idx = allContent.findIndex(c => c.id === updated.id);
  if (idx !== -1) allContent[idx] = updated;
  render();
}

// ── Calendar ──────────────────────────────────────────────────────────────────
function calNav(dir) {
  _calMonth = new Date(_calMonth.getFullYear(), _calMonth.getMonth() + dir, 1);
  renderCalendar();
}

function renderCalendar() {
  const year = _calMonth.getFullYear(), month = _calMonth.getMonth();
  const today = localDateStr();
  document.getElementById('cal-month-label').textContent = _calMonth.toLocaleDateString('en-AU',{month:'long',year:'numeric'});

  const items = filteredContent().filter(c => c.scheduledDate);
  const byDate = {};
  items.forEach(c => { (byDate[c.scheduledDate] = byDate[c.scheduledDate] || []).push(c); });

  const firstDow = new Date(year, month, 1).getDay();
  const padStart = firstDow === 0 ? 6 : firstDow - 1;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();

  let cells = '';
  const dows = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  cells += dows.map(d => `<div class="cal-dow">${d}</div>`).join('');

  for (let i = 0; i < padStart; i++) {
    const d = prevDays - padStart + 1 + i;
    cells += `<div class="cal-cell other-month"><div class="cal-day-num">${d}</div></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds === today;
    const events = (byDate[ds] || []).map(c =>
      `<div class="cal-event ${c.type==='long_form'?'long-form':'short-form'}" id="cevent-${c.id}"
        draggable="true"
        ondragstart="calDragStart(event,'${c.id}')"
        onclick="event.stopPropagation();openPanel('${c.id}')">${esc(c.title)}</div>`
    ).join('');
    cells += `<div class="cal-cell${isToday?' today':''}" data-date="${ds}"
      ondragover="event.preventDefault();this.classList.add('drag-over')"
      ondragleave="this.classList.remove('drag-over')"
      ondrop="calDrop(event,'${ds}')">
      <div class="cal-day-num">${d}</div>
      ${events}
    </div>`;
  }

  const totalCells = padStart + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 1; i <= remaining; i++) {
    cells += `<div class="cal-cell other-month"><div class="cal-day-num">${i}</div></div>`;
  }

  document.getElementById('cal-grid').innerHTML = cells;
}

let _calDragId = null;
function calDragStart(e, id) {
  _calDragId = id;
  e.dataTransfer.effectAllowed = 'move';
  document.getElementById(`cevent-${id}`)?.classList.add('dragging');
  e.stopPropagation();
}

async function calDrop(e, date) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const id = _calDragId;
  _calDragId = null;
  if (!id) return;
  const item = allContent.find(c => c.id === id);
  if (!item || item.scheduledDate === date) return;
  const res = await api('PUT', '/api/admin/content', { id, scheduledDate: date });
  if (!res.ok) { showToast('Failed to reschedule.'); return; }
  const updated = await res.json();
  const idx = allContent.findIndex(c => c.id === updated.id);
  if (idx !== -1) allContent[idx] = updated;
  const warn = shortNoticeDays(updated);
  render();
  if (warn !== null && warn < 7) showToast(`⚠️ Less than 1 week notice for guest — confirm with them.`);
  else showToast('Rescheduled');
}

function shortNoticeDays(item) {
  if (item.type !== 'long_form' || !item.scheduledDate || !item.guestIds.length) return null;
  return Math.round((new Date(item.scheduledDate) - new Date()) / 86400000);
}

// ── Detail panel ──────────────────────────────────────────────────────────────
function openPanel(id) {
  const item = allContent.find(c => c.id === id);
  if (!item) return;
  _panelId = id;
  _panelTab = 'details';
  _panelGuests = [...item.guestIds];
  document.getElementById('panel-title').textContent = item.title;
  renderPanelBody(item);
  document.getElementById('panel-overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel-overlay').classList.remove('open');
  document.getElementById('detail-panel').classList.remove('open');
  _panelId = null;
  _partnerPanelId = null;
}

function renderPanelBody(item) {
  const stages = item.type === 'long_form' ? LONG_STAGES : SHORT_STAGES;
  const guestChips = _panelGuests.map(gid => {
    const p = allPartners.find(x => x.id === gid);
    return p ? `<span class="guest-chip">${esc(p.name)}<button onclick="removePanelGuest('${gid}')">×</button></span>` : '';
  }).join('');
  const platforms = ['youtube','instagram','linkedin','tiktok','facebook','podcast'];
  const warnDays = shortNoticeDays(item);
  const warnHtml = warnDays !== null && warnDays < 7
    ? `<div class="warning-banner" style="display:block;">⚠️ Less than 1 week notice — confirm this with your guest.</div>` : '';
  const repurposedFrom = item.repurposedFromId ? allContent.find(c => c.id === item.repurposedFromId) : null;
  const longFormItems = allContent.filter(c => !c.deletedAt && c.type === 'long_form' && c.id !== item.id);
  const inPrep = _panelTab === 'prep';

  document.getElementById('panel-body').innerHTML = `
    <div class="ptabs">
      <button class="ptab${!inPrep?' active':''}" onclick="setPanelTab('details',this)">Details</button>
      <button class="ptab${inPrep?' active':''}" onclick="setPanelTab('prep',this)">Episode Prep</button>
    </div>

    <div id="panel-details-section"${inPrep?' style="display:none;"':''}>
      <div class="panel-section">
        <div class="panel-label">Type</div>
        <div style="font-size:13px;color:rgba(247,243,237,0.55);">${item.type === 'long_form' ? 'Long-form episode' : 'Short-form piece'}</div>
      </div>
      <div class="panel-section">
        <div class="panel-label">Title</div>
        <input class="panel-input" id="pn-title" value="${esc(item.title)}" onblur="panelSave()">
      </div>
      <div class="panel-section">
        <div class="panel-label">Stage</div>
        <div class="stage-sel">
          ${stages.map(s => `<button class="stage-btn${item.stage===s.key?' active':''}" onclick="panelSetStage('${s.key}',this)">${esc(s.label)}</button>`).join('')}
        </div>
      </div>
      <div class="panel-section">
        <div class="panel-label">Scheduled date</div>
        <input class="panel-input" type="date" id="pn-date" value="${item.scheduledDate||''}" onchange="panelSave()">
        ${warnHtml}
      </div>
      ${item.type === 'long_form' ? `<div class="panel-section">
        <div class="panel-label">Guests</div>
        <div id="pn-guest-chips" style="margin-bottom:6px;">${guestChips}</div>
        <div class="guest-search">
          <input class="panel-input" id="pn-guest-search" placeholder="Add guest from directory…" oninput="searchGuests(this.value,'pn')" autocomplete="off">
          <div class="guest-dropdown" id="pn-guest-dropdown"></div>
        </div>
      </div>` : ''}
      ${item.type === 'short_form' ? `<div class="panel-section">
        <div class="panel-label">Repurposed from</div>
        <select class="panel-input" id="pn-repurposed" onchange="panelSave()">
          <option value="">— None —</option>
          ${longFormItems.map(lf => `<option value="${lf.id}"${item.repurposedFromId===lf.id?' selected':''}>${esc(lf.title)}</option>`).join('')}
        </select>
        ${repurposedFrom ? `<div style="font-size:11.5px;color:rgba(247,243,237,0.3);margin-top:4px;">Cut from: ${esc(repurposedFrom.title)}</div>` : ''}
      </div>` : ''}
      <div class="panel-section">
        <div class="panel-label">Platforms</div>
        <div>${platforms.map(pl => `<label class="platform-cb"><input type="checkbox" value="${pl}" ${item.platforms.includes(pl)?'checked':''} onchange="panelSave()"> ${pl.charAt(0).toUpperCase()+pl.slice(1)}</label>`).join('')}</div>
      </div>
      <div class="panel-section">
        <div class="panel-label">Notes</div>
        <textarea class="panel-textarea" id="pn-notes" rows="3" onblur="panelSave()">${esc(item.notes||'')}</textarea>
      </div>
      <div class="panel-section">
        <div class="panel-label">Video file</div>
        <div class="video-section">
          ${item.videoKey

function searchGuests(q, prefix) {

  const results = allPartners.filter(p =>
    !currentGuests.includes(p.id) &&
    (p.name.toLowerCase().includes(q.toLowerCase()) || (p.company||'').toLowerCase().includes(q.toLowerCase()))
  ).slice(0, 8);

  dd.innerHTML = results.map(p =>

  ).join('');

function addGuest(gid, prefix) {
  const dd = document.getElementById(`${prefix}-guest-dropdown`);
  const input = document.getElementById(`${prefix}-guest-search`);
  dd.style.display = 'none';
  if (input) input.value = '';
  const p = allPartners.find(x => x.id === gid);
  if (!p) return;
  if (prefix === 'cm') {
    if (_cmGuests.includes(gid)) return;
    _cmGuests.push(gid);
    renderCmGuestChips();
  } else {
    if (_panelGuests.includes(gid)) return;
    _panelGuests.push(gid);
    const chips = _panelGuests.map(id => {
      const pg = allPartners.find(x => x.id === id);
      return pg ? `<span class="guest-chip">${esc(pg.name)}<button onclick="removePanelGuest('${id}')">×</button></span>` : '';
    }).join('');
    const el = document.getElementById('pn-guest-chips');
    if (el) el.innerHTML = chips;
    panelSave();
  }

async function downloadPanelVideo(contentId) {
  const res = await fetch(`/api/content-video/download-url?contentId=${contentId}`);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    showToast(err.error || 'Could not get download link.'); return;
  }
  const { downloadUrl, filename } = await res.json();
  const a = document.createElement('a');
  a.href = downloadUrl; a.download = filename || 'video'; a.click();
}

async function uploadPanelVideo(contentId, input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  const progWrap = document.getElementById('pn-prog-wrap');
  const progBar = document.getElementById('pn-prog-bar');
  if (progWrap) { progWrap.style.display = 'block'; progBar.style.width = '5%'; }

  const urlRes = await fetch(`/api/content-video/upload-url?contentId=${contentId}&filename=${encodeURIComponent(file.name)}`);
  if (!urlRes.ok) {
    const err = await urlRes.json().catch(() => ({}));
    showToast(err.error || 'Upload failed.');
    if (progWrap) progWrap.style.display = 'none'; return;
  }
  const { uploadUrl, key, contentType, filename } = await urlRes.json();
  if (progBar) progBar.style.width = '20%';

  const xhr = new XMLHttpRequest();
  xhr.open('PUT', uploadUrl);
  xhr.setRequestHeader('Content-Type', contentType);
  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable && progBar) progBar.style.width = (20 + Math.round(e.loaded / e.total * 70)) + '%';
  };
  xhr.onload = async () => {
    if (xhr.status < 200 || xhr.status >= 300) {
      showToast('Upload to storage failed. Try again.');
      if (progWrap) progWrap.style.display = 'none'; return;
    }
    if (progBar) progBar.style.width = '95%';
    const confirmRes = await fetch('/api/content-video/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contentId, key, filename }),
    });
    if (!confirmRes.ok) { showToast('Upload saved but metadata failed.'); if (progWrap) progWrap.style.display = 'none'; return; }
    const updated = await confirmRes.json();
    const idx = allContent.findIndex(c => c.id === contentId);
    if (idx !== -1) allContent[idx] = updated;
    if (progBar) progBar.style.width = '100%';
    setTimeout(() => {
      if (progWrap) { progWrap.style.display = 'none'; progBar.style.width = '0'; }
      renderPanelBody(updated);
      render();
      showToast('Video uploaded ✓');
    }, 600);
  };
  xhr.onerror = () => { showToast('Upload failed — check connection.'); if (progWrap) progWrap.style.display = 'none'; };
  xhr.send(file);
}

async function generateIdeas() {
  const topic = document.getElementById('ideas-topic').value.trim();

  // Pass recent titles so Claude avoids repeating them
  const recentTitles = allContent.filter(c => !c.deletedAt).slice(0, 20).map(c => c.title);

// ── Weekly recording target ───────────────────────────────────────────────────
function renderWeeklyTarget() {
  const bar = document.getElementById('weekly-target-bar');
  if (!bar || _view === 'partners') { if (bar) bar.style.display = 'none'; return; }
  bar.style.display = '';

  const now = new Date();
  const dow = now.getDay();
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(now); monday.setDate(now.getDate() + mondayOffset); monday.setHours(0,0,0,0);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);
  const monStr = localDateStr(monday);
  const sunStr = localDateStr(sunday);

  const thisWeek = allContent.filter(c => !c.deletedAt && c.scheduledDate >= monStr && c.scheduledDate <= sunStr);
  const count = thisWeek.length;
  const target = 2;
  const pct = Math.min(100, Math.round(count / target * 100));
  const color = count >= target ? '#6dbf7b' : count === 1 ? '#e8a87c' : '#e07070';
  const msg = count >= target
    ? `${count} recording${count !== 1 ? 's' : ''} this week — on track`
    : count === 1 ? `1 recording scheduled — 1 more to hit the target`
    : 'No recordings scheduled this week';
  const weekLabel = `${monday.toLocaleDateString('en-AU',{day:'numeric',month:'short'})} – ${sunday.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}`;
  const upcoming = thisWeek.sort((a,b) => a.scheduledDate.localeCompare(b.scheduledDate))
    .map(c => {
      const d = new Date(c.scheduledDate+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric'});
      const t = c.title.length > 32 ? c.title.slice(0,32)+'…' : c.title;
      return `<span style="display:inline-block;margin-right:12px;">${d} — ${esc(t)}</span>`;
    }).join('');

  bar.innerHTML = `
    <div class="weekly-bar">
      <div style="flex-shrink:0;">
        <div class="weekly-bar-sub">This week · ${weekLabel}</div>
        <div class="weekly-bar-msg" style="color:${color};">${msg}</div>
      </div>
      <div class="weekly-bar-track">
        <div class="weekly-bar-prog"><div class="weekly-bar-fill" style="width:${pct}%;background:${color};"></div></div>
        <div class="weekly-bar-meta"><span>${count} / ${target} episodes</span><span>weekly target</span></div>
      </div>
      ${upcoming ? `<div style="font-size:11.5px;color:rgba(247,243,237,0.3);flex-shrink:0;">${upcoming}</div>` : ''}
    </div>
  `;
}

const EP_KEY = 'fw_episode_prep';

function getAllPreps() { try { return JSON.parse(localStorage.getItem(EP_KEY)) || {}; } catch { return {}; } }
function getPrep(contentId) {
  const d = getAllPreps()[contentId];
  return d || { hook: '', runningOrder: [], questions: [], talkingPoints: [], cta: '' };
}
function savePrep(contentId, prep) {

}

function setPanelTab(tab, btn) {

function renderPrepSection(contentItem) {
  const prep = getPrep(contentItem.id);
  const cid = contentItem.id;
  const isLong = contentItem.type === 'long_form';

  const mkList = (listKey, placeholder, addLabel, numbered) => {
    const its = prep[listKey] || [];
    return `
      <div class="prep-list" id="prep-${listKey}-list">
        ${its.map((pt, i) => `
          <div class="prep-row" id="prep-${listKey}-${pt.id}">
            <span class="prep-num">${numbered ? i+1 : '·'}</span>
            <textarea class="prep-inp" rows="1" placeholder="${placeholder}…" onblur="savePrepItem('${cid}','${listKey}','${pt.id}',this.value)">${esc(pt.text||'')}</textarea>
            <button class="prep-rm" onclick="removePrepItem('${cid}','${listKey}','${pt.id}')">×</button>
          </div>`).join('')}
      </div>
      <button class="prep-add" onclick="addPrepItem('${cid}','${listKey}')">+ ${addLabel}</button>`;
  };

  return `
    <div class="panel-section">
      <div class="panel-label">Opening hook</div>
      <textarea class="panel-textarea" id="prep-hook" rows="2" placeholder="${isLong ? 'The line that sets the scene and makes them keep listening…' : 'The first 3 seconds that stop the scroll…'}" onblur="savePrepField('${cid}','hook',this.value)">${esc(prep.hook||'')}</textarea>
    </div>
    ${isLong ? `
    <div class="panel-section">
      <div class="panel-label">Running order</div>
      ${mkList('runningOrder','e.g. Intro — background story','Add segment',true)}
    </div>
    <div class="panel-section">
      <div class="panel-label">Key questions${contentItem.guestIds?.length?' (for guest)':''}</div>
      ${mkList('questions','Question','Add question',true)}
    </div>` : ''}
    <div class="panel-section">
      <div class="panel-label">Talking points</div>
      ${mkList('talkingPoints','Key point to cover','Add talking point',false)}
    </div>
    <div class="panel-section">
      <div class="panel-label">Call to action</div>
      <textarea class="panel-textarea" id="prep-cta" rows="2" placeholder="What do you want them to do? Subscribe, book a call, DM you…" onblur="savePrepField('${cid}','cta',this.value)">${esc(prep.cta||'')}</textarea>
    </div>`;
}

function savePrepField(contentId, field, value) {
  const prep = getPrep(contentId); prep[field] = value.trim(); savePrep(contentId, prep);
}

function addPrepItem(contentId, listKey) {
  const prep = getPrep(contentId);
  if (!prep[listKey]) prep[listKey] = [];
  const newItem = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,5), text: '' };
  prep[listKey].push(newItem);
  savePrep(contentId, prep);
  const cItem = allContent.find(c => c.id === contentId);
  if (cItem) {
    document.getElementById('panel-prep-section').innerHTML = renderPrepSection(cItem);
    setTimeout(() => {
      const listEl = document.getElementById(`prep-${listKey}-list`);
      const tas = listEl?.querySelectorAll('textarea');
      tas?.[tas.length - 1]?.focus();
    }, 50);
  }
}

function removePrepItem(contentId, listKey, itemId) {
  const prep = getPrep(contentId);
  if (prep[listKey]) prep[listKey] = prep[listKey].filter(p => p.id !== itemId);
  savePrep(contentId, prep);
  const cItem = allContent.find(c => c.id === contentId);
  if (cItem) document.getElementById('panel-prep-section').innerHTML = renderPrepSection(cItem);
}

function savePrepItem(contentId, listKey, itemId, value) {
  const prep = getPrep(contentId);
  const pt = prep[listKey]?.find(p => p.id === itemId);
  if (pt) { pt.text = value.trim(); savePrep(contentId, prep); }
}

const PS_KEY = 'fw_partner_series';
const EP_STATUSES = [

  { key: 'confirmed',     label: 'Confirmed' },
  { key: 'recorded',      label: 'Recorded' },

];
const EP_STATUS_LABELS = { planned:'Planned', outreach_sent:'Outreach sent', confirmed:'Confirmed', recorded:'Recorded', published:'Published' };

let _partnerPanelId = null;
let _partnerSearch = '';

function getPartnerSeries() {
  try { return JSON.parse(localStorage.getItem(PS_KEY)) || {}; } catch { return {}; }
}
function savePartnerSeries(data) { localStorage.setItem(PS_KEY, JSON.stringify(data)); }

function filterPartners(q) {

  renderPartners();
}

function renderPartners() {
  const wrap = document.getElementById('partners-grid');
  const summaryEl = document.getElementById('partners-summary');
  if (!wrap) return;

  const ps = getPartnerSeries();

  // Summary stats across all partners
  const allEps = Object.values(ps).flatMap(v => v.episodes || []);
  const allDone = allEps.filter(e => e.status === 'recorded' || e.status === 'published').length;
  if (summaryEl) summaryEl.textContent = `${allPartners.length} partner${allPartners.length!==1?'s':''} · ${allEps.length} episode${allEps.length!==1?'s':''} planned · ${allDone} done`;

  const q = _partnerSearch.toLowerCase();
  const partners = q
    ? allPartners.filter(p => p.name.toLowerCase().includes(q) || (p.company||'').toLowerCase().includes(q) || (p.role||'').toLowerCase().includes(q))
    : [...allPartners];

  if (!partners.length) {
    wrap.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">${q ? 'No partners match that search.' : 'No partners in directory yet.'}</div>`;
    return;
  }

  // Sort: partners with episodes first, then alphabetical
  partners.sort((a, b) => {
    const aLen = ps[a.id]?.episodes?.length || 0;
    const bLen = ps[b.id]?.episodes?.length || 0;
    return bLen - aLen || a.name.localeCompare(b.name);
  });

  wrap.innerHTML = partners.map(p => {
    const episodes = ps[p.id]?.episodes || [];
    const done = episodes.filter(e => e.status === 'recorded' || e.status === 'published').length;
    const dots = episodes.length
      ? episodes.map((e, i) => `<div class="ep-dot ep-dot-${e.status}" title="Ep ${i+1}: ${EP_STATUS_LABELS[e.status]||e.status}">${i+1}</div>`).join('')
      : `<span style="font-size:12px;color:rgba(247,243,237,0.18);">No episodes planned</span>`;
    const statsStr = episodes.length
      ? `${episodes.length} episode${episodes.length!==1?'s':''} · ${done} done`
      : 'Start the arc →';
    return `<div class="partner-card" onclick="openPartnerPanel('${p.id}')">
      <div class="partner-card-name">${esc(p.name)}</div>
      <div class="partner-card-role">${esc(p.role||p.company||'Partner')}</div>
      <div class="ep-track">${dots}</div>
      <div class="partner-card-stats">${statsStr}</div>
    </div>`;
  }).join('');
}

function openPartnerPanel(partnerId) {
  _partnerPanelId = partnerId;
  _panelId = null;
  const partner = allPartners.find(p => p.id === partnerId);
  if (!partner) return;
  document.getElementById('panel-title').textContent = partner.name;
  renderPartnerPanelBody(partnerId);
  document.getElementById('panel-overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
}

function renderPartnerPanelBody(partnerId) {
  const partner = allPartners.find(p => p.id === partnerId);
  if (!partner) return;
  const ps = getPartnerSeries();
  const episodes = ps[partnerId]?.episodes || [];
  const generalNotes = ps[partnerId]?.notes || '';
  const done = episodes.filter(e => e.status === 'recorded' || e.status === 'published').length;

  document.getElementById('panel-body').innerHTML = `
    <div style="font-size:12.5px;color:rgba(247,243,237,0.35);margin-bottom:20px;">${esc(partner.role||partner.company||'')}</div>

    <div class="panel-section">
      <div class="panel-label">Planning notes</div>
      <textarea class="panel-textarea" id="pp-notes" rows="2" placeholder="Topics they're strong on, relationship notes, preferred format…" onblur="savePartnerNotes('${partnerId}')">${esc(generalNotes)}</textarea>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <div>
        <div style="font-size:10.5px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:rgba(247,243,237,0.28);">Episode arc</div>
        ${episodes.length ? `<div style="font-size:11.5px;color:rgba(247,243,237,0.25);margin-top:2px;">${episodes.length} episode${episodes.length!==1?'s':''} · ${done} done</div>` : ''}
      </div>
      <button class="btn-secondary" style="font-size:12px;padding:6px 14px;" onclick="addPartnerEpisode('${partnerId}')">+ Add episode</button>
    </div>

    <div id="pp-episodes">
      ${episodes.length ? renderEpisodesHtml(partnerId, episodes) : `<div style="font-size:13px;color:rgba(247,243,237,0.2);padding:8px 0 4px;">No episodes planned yet. Click "Add episode" to start building the arc.</div>`}
    </div>
  `;
}

function renderEpisodesHtml(partnerId, episodes) {
  return episodes.map((ep, idx) => `
    <div class="partner-panel-ep" id="ep-block-${ep.id}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:10px;font-weight:700;letter-spacing:0.1em;color:rgba(247,243,237,0.22);">EP ${idx+1}</span>
          <span class="ep-status-pill ep-s-${ep.status}">${EP_STATUS_LABELS[ep.status]||ep.status}</span>
        </div>
        <button onclick="removePartnerEpisode('${partnerId}','${ep.id}')" style="background:none;border:none;color:rgba(247,243,237,0.2);cursor:pointer;font-size:18px;line-height:1;padding:0;" title="Remove">×</button>
      </div>
      <div style="margin-bottom:8px;">
        <div class="panel-label" style="font-size:9.5px;margin-bottom:4px;">Title</div>
        <input class="panel-input" style="font-size:13px;" value="${esc(ep.title||'')}" placeholder="Episode title…" onblur="saveEpField('${partnerId}','${ep.id}','title',this.value)">
      </div>
      <div style="margin-bottom:6px;">
        <div class="panel-label" style="font-size:9.5px;margin-bottom:4px;">Angle / hook</div>
        <textarea class="panel-textarea" style="font-size:12.5px;" rows="2" placeholder="Core angle and what the audience will take away…" onblur="saveEpField('${partnerId}','${ep.id}','angle',this.value)">${esc(ep.angle||'')}</textarea>
      </div>
      <div class="ep-status-sel">
        ${EP_STATUSES.map(s => `<button class="ep-status-btn${ep.status===s.key?' sa-'+s.key:''}" data-status="${s.key}" onclick="setEpStatus('${partnerId}','${ep.id}','${s.key}',this)">${s.label}</button>`).join('')}
      </div>
    </div>
  `).join('');
}

function addPartnerEpisode(partnerId) {
  const ps = getPartnerSeries();
  if (!ps[partnerId]) ps[partnerId] = { episodes: [], notes: '' };
  const ep = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,5), title: '', angle: '', status: 'planned' };
  ps[partnerId].episodes.push(ep);
  savePartnerSeries(ps);
  renderPartnerPanelBody(partnerId);
  renderPartners();
  setTimeout(() => document.getElementById(`ep-block-${ep.id}`)?.querySelector('.panel-input')?.focus(), 60);
}

function removePartnerEpisode(partnerId, epId) {
  const ps = getPartnerSeries();
  if (!ps[partnerId]) return;
  ps[partnerId].episodes = ps[partnerId].episodes.filter(e => e.id !== epId);
  savePartnerSeries(ps);
  renderPartnerPanelBody(partnerId);
  renderPartners();
}

function saveEpField(partnerId, epId, field, value) {
  const ps = getPartnerSeries();
  const ep = ps[partnerId]?.episodes?.find(e => e.id === epId);
  if (!ep) return;
  ep[field] = value.trim();
  savePartnerSeries(ps);
  renderPartners();
}

function setEpStatus(partnerId, epId, status, btn) {
  const ps = getPartnerSeries();
  const ep = ps[partnerId]?.episodes?.find(e => e.id === epId);
  if (!ep) return;
  ep.status = status;
  savePartnerSeries(ps);
  // In-place update — no full re-render so inputs don't lose focus
  const block = document.getElementById(`ep-block-${epId}`);
  if (block) {
    const pill = block.querySelector('.ep-status-pill');
    if (pill) { pill.className = `ep-status-pill ep-s-${status}`; pill.textContent = EP_STATUS_LABELS[status]; }
    block.querySelectorAll('.ep-status-btn').forEach(b => {
      b.className = 'ep-status-btn' + (b.dataset.status === status ? ' sa-' + status : '');
    });
    // Update ep count in panel header
    const ps2 = getPartnerSeries();
    const eps2 = ps2[partnerId]?.episodes || [];
    const done2 = eps2.filter(e => e.status === 'recorded' || e.status === 'published').length;
    const countEl = block.closest('#panel-body')?.querySelector('[data-ep-count]');
    if (countEl) countEl.textContent = `${eps2.length} episode${eps2.length!==1?'s':''} · ${done2} done`;
  }
  renderPartners();
}

function savePartnerNotes(partnerId) {
  const val = document.getElementById('pp-notes')?.value || '';
  const ps = getPartnerSeries();
  if (!ps[partnerId]) ps[partnerId] = { episodes: [], notes: '' };
  ps[partnerId].notes = val.trim();
  savePartnerSeries(ps);
}
</script>
</body>
</html>
